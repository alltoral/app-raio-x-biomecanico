<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raio-X Biomecânico · Área de membros</title>
<meta name="theme-color" content="#0F0F0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raio-X">
<link rel="icon" type="image/png" href="assets/simbolo.png">
<link rel="apple-touch-icon" href="assets/simbolo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: app de celular (coluna até 480px) com barra de abas fixa embaixo. Início = sequência da semana + checkpoint atual + jornada; Aula = vídeo + concluir; Calendário = mês com dias treinados. Tema único escuro, identidade Linha de Ouro. */
:root{
  --carvao:#0F0F0E;
  --carvao-2:#171614;
  --cartao:#1E1D1A;
  --grafite:#2A2823;
  --linha:#35322B;
  --osso:#E0E0E0;
  --texto:#F6F3EC;
  --apoio:#B8B2A6;
  --mudo:#857F73;
  --ambar:#D4A017;
  --ambar-claro:#EEC452;
  --ambar-escuro:#8A6810;
  --tinta:#121212;
  --verde:#7FBF7F;
  --marca:'Cinzel', 'Trajan Pro', Georgia, serif;
  --corpo:'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --virada:'Cormorant Garamond', Garamond, Georgia, serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--carvao)}
body{margin:0;color:var(--texto);font-family:var(--corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--ambar-claro);outline-offset:3px;border-radius:8px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 18px calc(96px + env(safe-area-inset-bottom, 0px));position:relative}
.rotulo{font-family:var(--marca);font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ambar)}
.rotulo.mudo{color:var(--mudo)}
.virada{font-family:var(--virada);font-style:italic;font-weight:600;color:var(--ambar)}
.entra{animation:entra .35s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Marca */
.marca{display:flex;align-items:center;gap:10px;padding-top:calc(14px + env(safe-area-inset-top, 0px));padding-bottom:12px;border-bottom:1px solid rgba(212,160,23,.22)}
.marca img{width:30px;height:30px;object-fit:contain;mix-blend-mode:lighten}
.marca span{font-family:var(--marca);font-size:12px;font-weight:600;letter-spacing:.2em;white-space:nowrap;color:var(--ambar)}
.marca i{flex:1}
.marca small{font-family:var(--marca);font-size:9px;font-weight:600;letter-spacing:.14em;white-space:nowrap;color:var(--mudo)}
/* Topo */
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px}
.ola{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,var(--grafite),var(--carvao-2));border:1px solid var(--ambar);display:grid;place-items:center;font-weight:700;color:var(--ambar);flex:none}
.ola small{display:block;font-size:13px;color:var(--mudo)}
.ola b{font-size:18px;font-weight:700}
.chama{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;padding:8px 12px;border-radius:999px;background:rgba(212,160,23,.12);border:1px solid rgba(212,160,23,.4);font-weight:700;font-size:15px;color:var(--ambar-claro);font-variant-numeric:tabular-nums}

/* Semana estilo GymRats */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 12px;border-radius:20px;background:var(--carvao-2);border:1px solid var(--linha)}
.dia{display:flex;flex-direction:column;align-items:center;gap:6px}
.dia span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mudo);text-transform:uppercase}
.dia i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:600;color:var(--apoio);border:1.5px solid var(--linha);font-variant-numeric:tabular-nums}
.dia.feito i{background:linear-gradient(160deg,var(--ambar-claro),var(--ambar));border-color:transparent;color:var(--tinta)}
.dia.hoje i{border-color:var(--ambar);color:var(--texto);box-shadow:0 0 0 3px rgba(212,160,23,.18)}
.dia.hoje span{color:var(--ambar)}
.dia.futuro i{opacity:.45}

/* Cartão do checkpoint atual */
.atual{position:relative;margin-top:18px;border-radius:24px;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;border:1px solid rgba(212,160,23,.55);isolation:isolate;text-align:left;width:100%}
.atual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.atual::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,15,14,.1),rgba(15,15,14,.92) 72%)}
.atual h2{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.atual .meta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--apoio)}
.play-btn{position:absolute;top:18px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--ambar);display:grid;place-items:center;box-shadow:0 10px 30px -6px rgba(212,160,23,.7)}
.continuar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;width:100%;min-height:54px;border-radius:999px;background:linear-gradient(180deg,var(--ambar-claro),var(--ambar));color:var(--tinta);font-weight:700;font-size:17px}

/* Progresso */
.progresso{margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--carvao-2);border:1px solid var(--linha);display:flex;flex-direction:column;gap:10px}
.progresso-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.progresso-topo b{font-size:15px;font-weight:600}
.progresso-topo span{font-size:14px;color:var(--apoio);font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:4px;background:var(--grafite);overflow:hidden}
.barra i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ambar-escuro),var(--ambar),var(--ambar-claro));transition:width .8s var(--ease)}

/* Jornada */
.secao{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px}
.secao h3{font-size:20px;font-weight:700}
.jornada{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.cp{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:18px;background:var(--carvao-2);border:1px solid var(--linha);width:100%;text-align:left;position:relative}
.cp.atualcp{border-color:var(--ambar);background:linear-gradient(160deg,rgba(212,160,23,.12),var(--carvao-2) 60%)}
.thumb{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--grafite)}
.thumb img{width:100%;height:100%;object-fit:cover}
.cp.bloq .thumb img{filter:grayscale(1) brightness(.45) blur(1.5px)}
.thumb .cad{position:absolute;inset:0;display:grid;place-items:center}
.cp-info{min-width:0;display:flex;flex-direction:column;gap:4px}
.cp-info small{font-family:var(--marca);font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ambar)}
.cp.bloq .cp-info small{color:var(--mudo)}
.cp-info b{font-size:16px;font-weight:600;line-height:1.25}
.cp.bloq .cp-info b{color:var(--apoio)}
.regiao{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--apoio)}
.mini7{display:inline-flex;gap:3px}
.mini7 i{width:6px;height:6px;border-radius:50%;background:#3A372F}
.mini7 i.on{background:var(--ambar);box-shadow:0 0 6px rgba(212,160,23,.8)}
.cp.bloq .mini7 i.on{background:#6B6556;box-shadow:none}
.status{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.status.ok{background:var(--ambar);color:var(--tinta)}
.status.agora{border:1.5px solid var(--ambar);color:var(--ambar)}
.status.lock{border:1px solid var(--linha);color:var(--mudo)}

/* Tela da aula */
.voltar{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--apoio);font-size:15px;margin-top:8px}
.player{position:relative;margin-top:6px;border-radius:20px;overflow:hidden;background:#141414;border:1px solid var(--linha);aspect-ratio:16/9}
.player video,.player img{width:100%;height:100%;object-fit:cover}
.player .breve{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(15,15,14,.72);text-align:center;padding:16px}
.player .breve b{font-size:16px}
.player .breve span{font-size:13px;color:var(--apoio)}
.aula-cab{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.aula-cab h1{font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;background:rgba(255,255,255,.04);border:1px solid var(--linha);color:var(--osso)}
.etapas{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.etapa{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--carvao-2);border:1px solid var(--linha)}
.etapa i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;border:1px solid var(--ambar);color:var(--ambar)}
.etapa div{display:flex;flex-direction:column}
.etapa b{font-size:15px;font-weight:600}
.etapa span{font-size:13px;color:var(--mudo)}
.bloco{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.bloco p{font-size:15px;color:var(--osso);line-height:1.5}
.protocolos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.protocolos li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--carvao-2);border:1px solid var(--linha)}
.protocolos b{font-size:14px;font-weight:500;line-height:1.35}
.protocolos .tag{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ambar-claro);border:1px solid rgba(212,160,23,.4);border-radius:999px;padding:4px 9px}
.concluir{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom, 0px));margin-top:22px;width:100%;min-height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;background:linear-gradient(180deg,var(--ambar-claro),var(--ambar));color:var(--tinta);box-shadow:0 14px 34px -12px rgba(212,160,23,.8)}
.concluir.feito{background:var(--cartao);color:var(--ambar-claro);border:1px solid rgba(212,160,23,.5);box-shadow:none}

/* Celebração */
.cel-fundo{position:fixed;inset:0;z-index:60;background:rgba(8,8,8,.8);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:surge .2s ease-out}
.cel{width:100%;max-width:380px;border-radius:28px;padding:30px 24px 24px;text-align:center;background:radial-gradient(120% 80% at 50% 0%,rgba(212,160,23,.28),transparent 60%),var(--cartao);border:1px solid rgba(212,160,23,.6);display:flex;flex-direction:column;align-items:center;gap:12px;animation:pula .5s var(--ease)}
.medalha{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--ambar-claro),var(--ambar-escuro));box-shadow:0 0 0 8px rgba(212,160,23,.15),0 0 40px rgba(212,160,23,.6)}
.cel h2{font-size:26px;font-weight:800}
.cel p{color:var(--apoio);font-size:15px}
.cel .liberado{margin-top:6px;width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--carvao-2);border:1px solid var(--linha);text-align:left}
.cel .liberado img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.cel .liberado small{font-family:var(--marca);font-size:10px;letter-spacing:.2em;color:var(--ambar)}
.cel .liberado b{display:block;font-size:15px}
.cel .continuar{margin-top:8px}
@keyframes surge{from{opacity:0}to{opacity:1}}
@keyframes pula{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:none}}
.confete{position:fixed;inset:0;pointer-events:none;z-index:61;overflow:hidden}
.confete i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cai 1.6s ease-in forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* Calendário */
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.cal-cab h2{font-size:22px;font-weight:700;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--linha);display:grid;place-items:center;color:var(--apoio)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stats div{padding:14px 12px;border-radius:16px;background:var(--carvao-2);border:1px solid var(--linha);display:flex;flex-direction:column;gap:2px}
.stats strong{font-size:28px;line-height:1.1;font-weight:800;color:var(--ambar);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--apoio)}
.grade-mes{margin-top:18px;padding:16px 12px;border-radius:20px;background:var(--carvao-2);border:1px solid var(--linha);display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grade-mes .sem{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mudo);padding-bottom:4px}
.grade-mes .d{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--apoio);font-variant-numeric:tabular-nums;position:relative}
.grade-mes .d.f{background:linear-gradient(160deg,var(--ambar-claro),var(--ambar));color:var(--tinta);font-weight:700}
.grade-mes .d.h{box-shadow:inset 0 0 0 1.5px var(--ambar);color:var(--texto);font-weight:600}
.grade-mes .d.fut{opacity:.35}
.legenda{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--apoio)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:50%}
.historico{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.historico li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:14px;background:var(--carvao-2);border:1px solid var(--linha);font-size:14px}
.historico li span{color:var(--mudo)}
.reset{display:block;margin:22px auto 0;min-height:44px;color:var(--mudo);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* Crise */
.crise{margin-top:18px;border-radius:24px;padding:22px;background:linear-gradient(160deg,#3A2D0C,#1C1810);border:1px solid rgba(212,160,23,.6);display:flex;flex-direction:column;gap:12px}
.crise h1{font-size:28px;font-weight:800;line-height:1.1}
.crise p{color:var(--apoio);font-size:15px}

/* Abas */
.abas{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(15,15,14,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid rgba(212,160,23,.25);padding-bottom:env(safe-area-inset-bottom, 0px)}
.abas div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.aba{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--mudo)}
.aba.on{color:var(--ambar)}
.aba.on svg{filter:drop-shadow(0 0 6px rgba(212,160,23,.6))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.credito{display:block;text-align:center;margin:28px auto 0;padding:8px 0;font-size:12px;letter-spacing:.04em;color:var(--mudo);text-decoration:none;opacity:.5;border:0}
.credito b{font-family:inherit;font-weight:600;letter-spacing:.04em;color:inherit}
.credito:hover{opacity:.8}
/* Pacote v1.0: fases, triagem, leitura, ritual, quiz */
.linha-dia{margin-bottom:14px;padding:14px 16px;border-radius:16px;border:1px solid rgba(212,160,23,.35);background:linear-gradient(160deg,rgba(212,160,23,.1),var(--carvao-2) 70%);display:flex;flex-direction:column;gap:4px}
.linha-dia b{font-size:17px}
.linha-dia span:last-child{font-size:14px;color:var(--apoio)}
.nota-42{font-size:12px;color:var(--mudo)}
.fase-cab{margin:22px 0 10px;display:flex;flex-direction:column;gap:4px}
.fase-cab h3{font-size:22px;font-weight:800}
.fase-cab p{font-size:14px;color:var(--apoio)}
.fase-cab.apoio{padding-top:16px;border-top:1px dashed var(--linha)}
.cp.apoiocp{border-style:dashed}
.status.apoio{border:1.5px dashed var(--ambar);color:var(--ambar)}
.mods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mod-item{width:100%;display:grid;grid-template-columns:22px 1fr 20px;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--carvao-2);border:1px solid var(--linha);text-align:left;font-size:15px;color:var(--osso)}
.mod-item svg{color:var(--ambar)}
.aviso{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--carvao-2);border:1px solid var(--linha);display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--osso)}
.aviso.alerta{border-color:rgba(230,120,90,.55);background:rgba(230,120,90,.08)}
.aviso b{font-size:15px;color:var(--texto)}
.link-acao{align-self:flex-start;color:var(--ambar-claro);text-decoration:underline;text-underline-offset:3px;min-height:40px;font-size:14px}
.triagem-card{min-height:150px;border-style:dashed}
.miudo{font-size:13px;color:var(--mudo);margin-top:10px}
.triagem{list-style:none;counter-reset:t;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.triagem li{counter-increment:t;padding:14px 16px;border-radius:16px;background:var(--carvao-2);border:1px solid var(--linha);display:flex;flex-direction:column;gap:10px}
.triagem li p{font-size:15px;line-height:1.45}
.triagem li p::before{content:counter(t)". ";color:var(--ambar);font-weight:700}
.sn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sn label,.opcs label{position:relative;display:block;cursor:pointer}
.sn input,.opcs input{position:absolute;opacity:0;pointer-events:none}
.sn span,.opcs span{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;border:1px solid var(--linha);font-weight:600;font-size:15px;color:var(--apoio)}
.opcs{display:flex;flex-direction:column;gap:6px}
.opcs span{justify-content:flex-start;padding:10px 14px;font-weight:500;text-align:left}
.sn input:checked+span,.opcs input:checked+span{border-color:var(--ambar);background:rgba(212,160,23,.14);color:var(--texto)}
.sn input:focus-visible+span,.opcs input:focus-visible+span{outline:2px solid var(--ambar-claro);outline-offset:2px}
.erro-tri{margin-top:12px;color:#E6785A;font-size:14px}
.gab{display:block;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--linha);background:#F4F1EA}
.gab img{width:100%;height:auto}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(8,8,8,.92);display:grid;place-items:center;padding:16px}
.zoom img{max-height:92vh;width:auto;border-radius:12px}
.zoom button{position:absolute;top:12px;right:16px;width:44px;height:44px;font-size:28px;color:var(--texto)}
.leitura{margin-top:22px;border-radius:16px;border:1px solid rgba(212,160,23,.4);background:var(--carvao-2);overflow:hidden}
.leitura summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;font-weight:600;color:var(--ambar-claro);cursor:pointer}
.leitura summary::-webkit-details-marker{display:none}
.leitura .texto{padding:0 16px 18px}
.texto{display:flex;flex-direction:column;gap:12px;margin-top:16px;font-size:15px;line-height:1.6;color:var(--osso)}
.texto h4{font-size:18px;font-weight:700;color:var(--texto);margin:14px 0 0;line-height:1.3}
.texto h5{font-size:15px;font-weight:700;color:var(--ambar-claro);margin:8px 0 0}
.texto h6{font-family:var(--marca);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ambar);margin:4px 0 -4px;font-weight:600}
.texto p,.texto li{margin:0}
.texto ul,.texto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.texto li::marker{color:var(--ambar)}
.texto table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
.texto th,.texto td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--linha)}
.texto th{font-weight:600;color:var(--ambar-claro);white-space:nowrap}
.protocolos b small{display:block;font-family:var(--marca);font-size:10px;letter-spacing:.18em;color:var(--mudo);margin-bottom:2px}
.ritual .escala{padding:12px 14px;border-radius:14px;background:var(--carvao-2);border:1px solid var(--linha);display:flex;flex-direction:column;gap:10px}
.escala-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.escala-cab b{font-size:15px}
.escala-cab span{font-size:12px;color:var(--mudo)}
.nvs{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nv{min-height:36px;border-radius:9px;border:1px solid var(--linha);font-size:13px;font-weight:600;color:var(--apoio);font-variant-numeric:tabular-nums}
.nv.on{background:var(--ambar);border-color:var(--ambar);color:var(--tinta)}
.nv.alto.on{background:#E6785A;border-color:#E6785A}
.quiz-topo{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.pontos{display:flex;gap:5px}
.pontos i{width:22px;height:5px;border-radius:3px;background:var(--grafite)}
.pontos i.on{background:var(--ambar)}
.pontos i.cur{box-shadow:0 0 0 1px var(--ambar)}
.chip.seg{margin-top:16px;border-color:rgba(230,120,90,.55);color:#F0A48C}
.pergunta{font-size:22px;line-height:1.3;font-weight:700;margin-top:16px}
.ops{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.op{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--linha);background:var(--carvao-2);text-align:left;font-size:15px;line-height:1.4}
.op i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;border:1px solid var(--linha);color:var(--apoio)}
.op.certa{border-color:var(--verde);background:rgba(127,191,127,.1)}
.op.certa i{background:var(--verde);color:var(--tinta);border-color:var(--verde)}
.op.errada{border-color:#E6785A;background:rgba(230,120,90,.08)}
.op:disabled{cursor:default}
.explica{margin-top:16px;padding:14px 16px;border-radius:14px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5;border:1px solid var(--linha);background:var(--carvao-2)}
.explica.ok b{color:var(--verde)}
.explica.nok b{color:#F0A48C}
.resultado{margin-top:26px;border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;border:1px solid var(--linha);background:var(--carvao-2)}
.resultado.ok{border-color:rgba(212,160,23,.6);background:radial-gradient(120% 80% at 50% 0%,rgba(212,160,23,.22),transparent 60%),var(--carvao-2)}
.resultado strong{font-size:52px;font-weight:800;line-height:1;color:var(--ambar)}
.resultado.nok strong{color:var(--apoio)}
.resultado p{color:var(--apoio);font-size:15px}
</style>

 quadril?", "o": ["O joelho estala", "O glúteo trabalha mais", "A lombar arqueia e assume a carga", "Nada, pode subir o quanto quiser"], "c": 2, "e": "Subir demais arqueia a lombar. A subida vai até alinhar joelho, quadril e ombro, e para ali.", "s": false}, {"q": "Na ponte glútea aparece cãibra atrás da coxa. O que isso quer dizer?", "o": ["O isquiotibial assumiu o movimento no lugar do glúteo", "Falta magnésio", "O glúteo está trabalhando bem", "Você está pronto para avançar"], "c": 0, "e": "Cãibra atrás da coxa é sinal de que o isquiotibial assumiu. Reduza a altura e pense em subir com o glúteo.", "s": false}, {"q": "Como é a respiração do protocolo do checkpoint 6?", "o": ["Não há respiração neste checkpoint", "Inspira 4 segundos pelo nariz, solta 6 pela boca, 10 ciclos", "Respiração rápida e curta", "Inspira 10 e solta 2"], "c": 1, "e": "Quatro segundos dentro, seis fora, dez ciclos, no início e no fim de cada sessão. Cerca de dois minutos.", "s": false}, {"q": "Na rotary stability, o que não pode acontecer ao esticar braço e perna?", "o": ["O braço ficar estendido", "A pelve rodar para conseguir o movimento", "Você olhar para o chão", "A perna ficar elevada"], "c": 1, "e": "A pelve não pode rodar. Se ela gira, o movimento saiu do core e foi para a lombar.", "s": false}, {"q": "Na prancha, como você sabe que está no limite?", "o": ["Quando passa de 10 segundos", "Quando sente o abdômen", "Quando a lombar afunda ou sobe", "Quando começa a tremer"], "c": 2, "e": "A linha reta da cabeça ao calcanhar é o critério. Quando a lombar afunda ou sobe, acabou.", "s": false}, {"q": "No dead bug, o que precisa permanecer durante todo o movimento?", "o": ["A lombar em contato com o solo", "A cabeça levantada", "As pernas esticadas no chão", "Os braços em cima da barriga"], "c": 0, "e": "A lombar permanece em contato com o solo. Se ela descola, o nível está alto demais.", "s": false}, {"q": "Prender a respiração durante o core é erro porque:", "o": ["Deixa o exercício mais fácil", "Não tem efeito nenhum", "Só atrapalha quem tem asma", "Aumenta a pressão dentro do abdômen e o corpo se protege"], "c": 3, "e": "Prender a respiração sobe a pressão intra-abdominal e o corpo recruta proteção em vez de estabilidade real.", "s": false}]}, "7": {"qs": [{"q": "Qual é o sinal mais importante de reprovação no single leg squat?", "o": ["O joelho entrar para dentro", "A descida ser rasa", "A perna tremer", "O tronco inclinar um pouco"], "c": 0, "e": "Joelho para dentro é o sinal mais importante. É o que explica a dor no joelho que aparece só na escada.", "s": false}, {"q": "No Y Balance, qual diferença entre os lados é considerada reprovada?", "o": ["Qualquer diferença", "Não se compara os lados", "Mais de 50 por cento", "Mais de 10 por cento"], "c": 3, "e": "Mais de 10 por cento de diferença entre os lados. Abaixo disso, entra na variação normal.", "s": false}, {"q": "Durante o step down, a pelve desaba para o lado. O que isso indica?", "o": ["Falta de força no quadríceps do lado que desce", "O glúteo do lado de apoio não está estabilizando", "Problema no tornozelo", "É normal"], "c": 1, "e": "É o glúteo do lado de apoio falhando. A pelve cai porque nada a segura naquele lado.", "s": false}, {"q": "No step up, de onde deve vir a força da subida?", "o": ["Dos dois braços", "Da perna que está no degrau", "Do impulso do tronco", "Da perna que está no chão, empurrando"], "c": 1, "e": "Da perna que está no degrau. Empurrar com a de baixo tira todo o valor do exercício.", "s": false}, {"q": "No clamshell, o que não pode acontecer quando você abre o joelho?", "o": ["A pelve rolar para trás", "Você respirar", "O pé se separar do outro", "O joelho se mover"], "c": 0, "e": "A pelve não pode rolar para trás. É o erro que faz o exercício parecer certo e não trabalhar o glúteo médio.", "s": false}, {"q": "A hierarquia de medo que você escreveu no checkpoint 3 entra onde?", "o": ["Também aqui, no checkpoint 7", "Só no checkpoint 3", "Não entra em nenhum exercício", "Só no fim do curso"], "c": 0, "e": "Volta aqui. Se um dos movimentos que você evita envolve uma perna só, é neste checkpoint que ele entra na progressão.", "s": false}, {"q": "Na elevação lateral da perna, o pé aponta para o teto. O que isso significa?", "o": ["O quadril rodou para fora, o que mascara o trabalho do glúteo médio", "Está correto", "Falta alongamento", "É a forma avançada"], "c": 0, "e": "Pé para o teto é rotação externa do quadril. O pé deve apontar para a frente.", "s": false}]}, "8": {"qs": [{"q": "No CKCUES, a escápula fica parada e o ombro faz todo o movimento. O que isso indica?", "o": ["Falta de força no peitoral", "Bom controle do ombro", "Escápula travada, que é a causa da dor entre as escápulas", "É o esperado"], "c": 2, "e": "Escápula travada é o que produz a dor entre as escápulas no fim do dia. O movimento precisa acontecer na escápula.", "s": false}, {"q": "No wall slide, qual é o erro mais comum?", "o": ["Respirar", "Arquear a lombar para conseguir subir", "Subir os braços devagar", "Manter os antebraços na parede"], "c": 1, "e": "Arquear a lombar é compensar pela coluna de baixo o que falta na de cima. O movimento perde o sentido.", "s": false}, {"q": "No prone Y, T, W, I, onde a testa fica?", "o": ["Virada para o lado", "Livre, sem apoio", "Levantada, olhando para frente", "Apoiada, com o pescoço neutro"], "c": 3, "e": "Apoiada e com o pescoço neutro. Levantar a cabeça para ganhar amplitude tira o foco da escápula.", "s": false}, {"q": "No serratus punch, o cotovelo deve ficar como?", "o": ["Estendido durante todo o movimento", "Apoiado no chão", "Apontando para fora", "Dobrado a 90 graus"], "c": 0, "e": "Estendido. O movimento é de protração da escápula, e não de flexão do cotovelo.", "s": false}, {"q": "No push-up plus, o que é o plus?", "o": ["Uma repetição extra no fim", "Subir a cabeça", "O empurrão final que afasta as escápulas, no topo", "Dobrar o joelho"], "c": 2, "e": "É o empurrão final com o cotovelo estendido, que afasta as escápulas. Sem ele, é só uma flexão.", "s": false}, {"q": "No sleeper stretch, onde você deve sentir o alongamento?", "o": ["No peito", "Na frente do ombro", "No cotovelo", "Atrás do ombro"], "c": 3, "e": "Atrás do ombro. Sentir na frente indica que a posição está errada ou que há impacto na articulação.", "s": false}, {"q": "Por que o protocolo do checkpoint 8 também depende do checkpoint 4?", "o": ["Não depende", "Porque são o mesmo teste", "Porque o ombro melhora quando a coluna de cima destrava", "Porque usa a mesma faixa elástica"], "c": 2, "e": "O ombro depende da coluna de cima. É o mesmo corpo: mobilidade torácica e ombro caminham juntos.", "s": false}]}, "9": {"qs": [{"q": "Como deve ser o som da aterrissagem em um salto?", "o": ["Alto, mostra que você chegou forte", "Não importa o som", "Silencioso", "Deve haver estalo"], "c": 2, "e": "Silencioso. Barulho indica que o corpo não amortecendo, e o impacto vai para a articulação.", "s": false}, {"q": "No drop landing, como você sai da caixa?", "o": ["De costas", "Dando um passo à frente, sem pular", "Correndo", "Saltando para frente"], "c": 1, "e": "Um passo à frente. O exercício é sobre a aterrissagem, e não sobre o salto.", "s": false}, {"q": "Na aterrissagem, o joelho cai para dentro. O que fazer?", "o": ["Parar e voltar um nível de progressão", "Continuar, melhora com repetição", "Aumentar a altura da caixa", "Fazer mais rápido"], "c": 0, "e": "Voltar um nível. Valgo na aterrissagem é sinal de que a base ainda não está pronta para essa demanda.", "s": false}, {"q": "Qual diferença entre os lados no hop test é considerada reprovada?", "o": ["Mais de 30 por cento", "Não se mede", "Qualquer diferença", "Mais de 10 por cento"], "c": 3, "e": "Mais de 10 por cento entre os lados. É a mesma régua do Y Balance.", "s": false}, {"q": "Você respondeu sim a um sinal da triagem. Qual é a conduta no checkpoint 9?", "o": ["Só o salto com as duas pernas", "Sim, se não doer", "Sim, com menos intensidade", "Pular o checkpoint e falar com o Douglas"], "c": 3, "e": "Não. O checkpoint 9 é o de maior carga do método, e a triagem vale mais aqui do que em qualquer outro lugar.", "s": true}, {"q": "Durante a progressão de alta demanda, a dor passou de 3 de 10. O que fazer?", "o": ["Voltar um nível", "Trocar de exercício", "Continuar e monitorar", "Dobrar o volume"], "c": 0, "e": "Voltar um nível. A regra de segurança é mais rígida aqui porque a carga é maior.", "s": false}, {"q": "Depois do salto para a caixa, como você desce?", "o": ["Correndo para frente", "De costas", "Saltando de volta", "Passo a passo, com controle"], "c": 3, "e": "Passo a passo. O salto de volta é o momento em que a maioria das lesões acontece em treino de salto.", "s": false}]}, "10": {"qs": [{"q": "No método, qual é o papel da medicina tradicional chinesa e da digitopressão?", "o": ["Diagnosticar a causa", "Curar a dor lombar", "Substituir o exercício", "Apoiar conforto e adesão ao protocolo"], "c": 3, "e": "Apoio de conforto e adesão. O que constrói o resultado é a avaliação em cadeia, a progressão de carga e o acompanhamento.", "s": false}, {"q": "Como deve ser a pressão nos pontos de digitopressão?", "o": ["Com a unha", "Firme e não dolorosa", "Forte, até provocar dor", "Levíssima, só encostar"], "c": 1, "e": "Firme e não dolorosa. Se doer muito, a força foi excessiva e deve cair pela metade.", "s": false}, {"q": "Quais são os três níveis do tratamento por meridiano?", "o": ["Antes, durante e depois do exercício", "Leve, médio e forte", "Pé, mão e orelha", "Tonificar o meridiano, sedar o acoplado e tratar o órgão com rotina"], "c": 3, "e": "Tonificar, sedar o acoplado quando há excesso, e tratar o órgão pelo estilo de vida.", "s": false}, {"q": "Qual dos três níveis é o que mais muda o resultado no longo prazo?", "o": ["Nenhum deles", "O segundo, de sedação", "O primeiro, de tonificação", "O terceiro, que é rotina: horário de comer, mastigar bem, dormir"], "c": 3, "e": "O terceiro. Ele é rotina, e não ponto: horário de comer, mastigar bem, dormir.", "s": false}, {"q": "Qual é o papel da digitopressão diante da avaliação médica?", "o": ["Só se a dor for antiga", "Sim, se você tiver certeza do ponto", "Ela apoia o conforto e nunca substitui a avaliação", "Sim, em casos leves"], "c": 2, "e": "Não. Pressão em ponto nenhum substitui avaliação, e o curso diz isso de forma explícita.", "s": false}, {"q": "Quando a digitopressão é mais útil dentro do método?", "o": ["Só no primeiro dia", "Nos dias em que a dor está alta e você não consegue fazer o exercício", "Em nenhuma situação", "Nos dias em que a dor está baixa"], "c": 1, "e": "Nos dias de dor alta. É quando ela ajuda a pessoa a não sair do protocolo.", "s": false}, {"q": "A reflexologia dos pés e das mãos é mais indicada em qual momento do dia?", "o": ["Antes de dormir, para relaxar", "Ao acordar", "Durante o exercício", "Depois do almoço"], "c": 0, "e": "Antes de dormir. Além do conforto, ajuda no relaxamento que precede o sono, e sono é parte do tratamento.", "s": false}]}, "11": {"qs": [{"q": "Como a correlação entre mordida e cadeia cervical é apresentada no método?", "o": ["Como invenção sem base", "Como hipótese clínica em investigação", "Como a causa principal da dor", "Como fato comprovado"], "c": 1, "e": "Como hipótese em investigação. Apresentar como consenso seria desonesto com você.", "s": false}, {"q": "O que o checkpoint 11 faz de fato?", "o": ["Diagnostica bruxismo", "Substitui a consulta odontológica", "Faz uma triagem simples e orienta a procurar dentista quando indicar", "Trata o dente"], "c": 2, "e": "Triagem e orientação. O tratamento do dente acontece no dentista, e o curso diz isso com todas as letras.", "s": false}, {"q": "Se o teste indicar correlação dentária, qual é o próximo passo?", "o": ["Continuar o protocolo e ignorar", "Aumentar a digitopressão", "Procurar um dentista", "Parar o curso"], "c": 2, "e": "Procurar um dentista. Resolver isso no curso seria mentira, e o método não faz isso.", "s": false}, {"q": "Qual destes é um sinal de que você pode estar apertando os dentes?", "o": ["Acordar com a mandíbula cansada", "Sentir o pé frio", "Cãibra na panturrilha", "Dor no cotovelo ao digitar"], "c": 0, "e": "Mandíbula cansada ao acordar é o sinal mais comum, junto com dor no masseter e dor de cabeça no fim do dia.", "s": false}, {"q": "É correto dizer que o dente causa a sua dor de pescoço?", "o": ["Não. O método mostra o que é observável e o que precisa ser investigado", "Sim, em todos os casos", "Sim, é o que o método afirma", "Só se doer ao mastigar"], "c": 0, "e": "O método não afirma isso. Ele mostra o que observa na prática e o que você pode investigar com um dentista.", "s": false}, {"q": "Na automassagem da face, como deve ser a pressão na frente da orelha?", "o": ["Fazer só de manhã", "Pressão leve, longe da frente da orelha, onde passa a artéria", "Usar as duas mãos ao mesmo tempo", "Apertar forte para soltar"], "c": 1, "e": "Sem pressão forte na frente da orelha, pela artéria temporal. Pressão leve e circular.", "s": false}, {"q": "Você tem travamento ou estalo com dor na mandíbula. O que fazer?", "o": ["Procurar um dentista ou especialista em ATM", "Ignorar e seguir o curso", "Abrir a boca ao máximo todos os dias", "Massagear mais forte"], "c": 0, "e": "Procurar especialista. Travamento com dor é sinal de avaliação, e não de mais exercício.", "s": false}]}, "12": {"qs": [{"q": "No Y stretching, para onde os polegares apontam?", "o": ["Para o chão", "Para os lados", "Não importa", "Para o teto"], "c": 3, "e": "Para o teto. É o que coloca o ombro em rotação externa e faz o exercício trabalhar a escápula.", "s": false}, {"q": "No W stretching, como ficam os cotovelos?", "o": ["Apoiados no chão", "Flexionados a 90 graus, com os braços abduzidos a 90", "Dobrados a 45 graus", "Estendidos"], "c": 1, "e": "Flexionados a 90 graus e os braços abduzidos a 90. É a posição que forma o W.", "s": false}, {"q": "Se você precisa de impulso para subir os braços no Y e no W, o que isso indica?", "o": ["Só é erro no W", "Não é erro, ajuda a subir mais", "Que a amplitude passou do que você controla", "É erro apenas para iniciantes"], "c": 2, "e": "Se precisa de impulso, a amplitude passou do que você controla. Este exercício é de controle, e não de força.", "s": false}, {"q": "Como a respiração acompanha o Y e o W?", "o": ["Inspira na subida, solta no retorno", "Respira rápido e curto", "Solta na subida, inspira no retorno", "Prende a respiração"], "c": 0, "e": "Inspira subindo, solta descendo. A inspiração expande o tórax e facilita; a expiração integra o abdômen.", "s": false}, {"q": "Para que serve o checkpoint 12 no conjunto do método?", "o": ["Substituir os outros", "Só alongar", "Integrar o que você ganhou nos outros checkpoints", "Medir uma parte nova do corpo"], "c": 2, "e": "Ele integra. Não mede parte nova: devolve ao ombro e à coluna de cima o movimento que o dia sentado tirou.", "s": false}, {"q": "Em que dia o Y e o W são mais úteis?", "o": ["Só nos dias em que está tudo bem", "Nos dias em que a dor está alta e não dá para fazer o resto", "Em nenhuma situação", "Uma vez por mês"], "c": 1, "e": "Nos dias de dor alta. É o que mantém a pessoa em movimento quando o protocolo completo não cabe.", "s": false}, {"q": "Na progressão com peso, qual faixa de carga é indicada?", "o": ["5 a 10 kg por mão", "Não há progressão com peso", "1 a 2 kg por mão", "20 kg"], "c": 2, "e": "Um a dois quilos por mão, ou banda leve. O critério do Y e do W sem peso continua valendo com a carga.", "s": false}]}, "gate9": {"qs": [{"q": "Você teve entorse de tornozelo, lesão de joelho ou cirurgia no joelho ou no tornozelo nos últimos 6 meses?", "o": ["Não", "Sim, mas já estou liberado", "Sim, e ainda sinto instabilidade ou dor", "Sim, e foi cirurgia"], "e": "Instabilidade residual e pós-operatório recente mudam a resposta à carga de salto, e isso não se avalia em casa."}, {"q": "Você sente dor no joelho ao descer escada, agachar ou ajoelhar?", "o": ["Não", "Sinto um incômodo leve, sem dor", "Sinto dor, mas passa", "Sinto dor que fica"], "e": "Dor patelofemoral é a queixa que mais aparece na aterrissagem, e o checkpoint 9 é justamente carga de aterrissagem."}, {"q": "Você consegue ficar 30 segundos em uma perna só, sem tocar o chão com a outra e sem balançar o tronco?", "o": ["Sim, nas duas pernas", "Sim, mas com dificuldade em uma", "Não, em uma das pernas", "Não consigo em nenhuma"], "e": "É o critério do checkpoint 7. Sem passar no 7, não existe base para o 9."}, {"q": "Você consegue aterrissar de um degrau de 20 cm com os dois pés, sem barulho e sem perder o equilíbrio?", "o": ["Sim, com controle", "Sim, mas faço barulho", "Sim, mas preciso dar um passo para equilibrar", "Não tentei ou não consigo"], "e": "É o teste de aterrissagem do próprio checkpoint, feito antes de liberar o módulo."}, {"q": "Você tem espaço livre, piso firme e não escorregadio, e uma caixa ou degrau estável que não tomba?", "o": ["Sim, os três", "Tenho espaço, mas o piso é escorregadio", "Tenho espaço, mas não tenho caixa estável", "Não tenho espaço adequado"], "e": "Ambiente é parte da segurança, e não detalhe. Piso escorregadio em salto é lesão."}, {"q": "Você tem alguma condição que afeta equilíbrio, tontura ou sensibilidade dos pés?", "o": ["Não", "Tenho tontura ocasional", "Tenho diagnóstico que afeta o equilíbrio", "Tenho perda de sensibilidade nos pés"], "e": "Salto exige resposta rápida de equilíbrio. Tontura e neuropatia mudam o risco."}, {"q": "Você está com dor acima de 3 de 10 hoje, ou teve dor que piorou no dia seguinte ao último exercício?", "o": ["Não", "Estou com dor entre 3 e 5", "Estou com dor acima de 5", "Tive piora no dia seguinte ao último exercício"], "e": "É a regra de segurança do curso aplicada à porta de entrada do módulo de maior carga."}], "bloq": "Este módulo não abre agora. Você respondeu a uma ou mais perguntas de segurança de um jeito que indica que o seu corpo ainda não está pronto para carga de salto em casa. Isso é informação, e não reprovação. Se a resposta foi sobre dor ou piora no dia seguinte: volte aos checkpoints 6 e 7, mantenha a regra de 3 de 10, e refaça este quiz em 4 semanas. Se a resposta foi sobre entorse, lesão ou cirurgia recente: procure avaliação presencial antes de qualquer salto. Isso precisa de avaliação presencial, e o curso não resolve aqui. Se a resposta foi sobre o ambiente: resolva o ambiente antes. Piso firme e caixa estável não são opcionais. O restante do método continua disponível. O checkpoint 9 é o único que fica fechado."}};
  var APOIO = [{"t": "Módulo 0: antes de começar", "by": "Abertura do programa, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>A triagem de segurança e o que esperar do programa. Leia antes de qualquer teste.<\/p><h4>Por que existe uma triagem<\/h4><p>Antes de qualquer teste, sete perguntas. Elas não são burocracia e não são para te assustar: existem para separar a dor que se resolve com movimento da dor que precisa de avaliação presencial primeiro.<\/p><p>Responda com honestidade. Se você marcar um sim e mesmo assim fizer os testes, o resultado não vai valer nada, porque o teste foi feito em um corpo que não era o caso de testar.<\/p><h4>As sete perguntas<\/h4><ol><li>Você perdeu o controle da urina ou do intestino, ou está com dificuldade para urinar?<\/li><li>Sente dormência ou anestesia na região entre as pernas, como se fosse uma sela?<\/li><li>Está perdendo força na perna de forma progressiva, ou o pé está arrastando?<\/li><li>Teve queda ou batida forte recentemente, ou tem osteoporose diagnosticada?<\/li><li>Está com febre, calafrios, perdeu peso sem explicação, ou já teve câncer?<\/li><li>A dor piora à noite, não muda com a posição, e vem piorando há semanas?<\/li><li>Usa corticoide há mais de três meses, ou tem dor pulsátil no abdômen?<\/li><\/ol><p>Um sim em qualquer uma delas suspende o protocolo. Procure avaliação presencial e me mande uma mensagem para eu te orientar sobre onde ir.<\/p><h4>Três perguntas de sono<\/h4><p>Estas não suspendem nada, mas entram no seu mapa:<\/p><ul><li>Quantas horas você dorme numa noite normal?<\/li><li>Acorda descansado ou já cansado?<\/li><li>Dorme e acorda no mesmo horário, inclusive no fim de semana?<\/li><\/ul><p>Dormir menos de seis horas aumenta a chance de a dor voltar. É um dos fatores que mais pesa e um dos mais fáceis de mudar, e serve como sinal, não como diagnóstico.<\/p><h4>O que você vai receber<\/h4><table><tr><th>Parte<\/th><th>O que é<\/th><\/tr><tr><td>Entender<\/td><td>Uma aula de mecânica, em seis blocos. Recomendo assistir antes de tudo<\/td><\/tr><tr><td>Medir<\/td><td>Doze testes, feitos em casa, filmados com o celular e comparados com o gabarito<\/td><\/tr><tr><td>Corrigir<\/td><td>Um protocolo para cada teste reprovado, com critério para saber se está certo<\/td><\/tr><\/table><h4>A regra de liberação<\/h4><p>Cada checkpoint tem um quiz de sete perguntas. Cinco acertos liberam o próximo. O quiz existe para eu saber que você entendeu o critério, e não que decorou o nome do exercício.<\/p><h4>O que você precisa ter<\/h4><p>Um celular para filmar, uma parede lisa, uma cama firme, uma fita ou fita crepe, e um espaço livre de cerca de 2 por 2 metros. Nada além disso.<\/p><h4>Quanto tempo por dia<\/h4><p>Cerca de 15 minutos. Se um dia não couber, faça a metade. Metade feita vale infinitamente mais que o dia inteiro não feito.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Módulo 1: por que a sua dor volta", "by": "Aula de mecânica, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>A aula que explica a lógica antes de pedir o esforço. Seis blocos, cerca de 60 minutos de vídeo.<\/p><h4>Bloco 1: a dor não mora onde dói<\/h4><p>O ponto que dói costuma ser o último da cadeia, e não o primeiro. A lombar paga a conta de um quadril curto. O pescoço paga a conta de uma coluna de cima travada. O joelho paga a conta de um glúteo que não segura.<\/p><p>Cuidar só do ponto que dói alivia e deixa a sobrecarga entrando pelo mesmo caminho. É por isso que alivia e volta.<\/p><p>A frase que resume o método: a dor voltou porque da última vez trataram onde doía.<\/p><h4>Bloco 2: exame normal e dor real<\/h4><p>O exame de imagem é uma foto: mostra a sua estrutura parada, deitada, sem carga. A sua dor acontece no movimento, quando você levanta, abaixa, gira e pisa. A foto não filma o vídeo.<\/p><p>Isso não invalida a sua dor nem o exame. O exame serve para descartar o que é grave. Ele só não explica a dor que não é grave.<\/p><p>E existe outro ponto que costuma aliviar muita gente: alterações de disco aparecem em uma parte enorme das pessoas que não sentem dor nenhuma. O seu desgaste provavelmente também está no exame de alguém que joga bola no fim de semana.<\/p><h4>Bloco 3: por que ela volta<\/h4><p>Duas razões, e a segunda é a que quase ninguém trata.<\/p><p>A primeira: voltou porque a causa ficou onde estava.<\/p><p>A segunda: voltou porque você mudou o jeito de se mover para fugir da dor. Quando dói, você protege. Apoia mais numa perna, trava o quadril, encurta o passo, para de abaixar. Isso funciona, a dor baixa, e depois de algumas semanas o jeito protegido vira o jeito normal. Quando a dor passa, você continua se movendo assim.<\/p><p>Existe um nome para isso: medo do movimento. Ele é uma resposta de proteção que o corpo aprendeu, e se desfaz com exposição gradual, não com coragem. É por isso que nos checkpoints 3 e 7 eu peço que você liste os movimentos que evita: a gente volta a eles devagar, de propósito.<\/p><h4>Bloco 4: sono e caminhada<\/h4><p>O corpo se recupera fora da sessão, e a maior parte dessa recuperação acontece dormindo. Três coisas que não custam dinheiro: horário fixo (inclusive no fim de semana), menos luz na última hora e quarto fresco, escuro e silencioso.<\/p><p>A caminhada é o exercício com melhor relação entre custo e entrega, e é o menos prescrito. Ela mantém o corpo em movimento, melhora o sono, reduz o medo de se mover e cria uma rotina que dá para cumprir.<\/p><p>O protocolo de caminhada entra no checkpoint 2 e tem progressão de seis semanas, com regra de segurança. A regra é a mesma de todo o curso: dor até 3 de 10 durante, e no dia seguinte (24 horas) de volta ao nível de antes.<\/p><h4>Bloco 5: como ler o seu mapa<\/h4><p>Quando você terminar os doze testes, aparece um mapa. Ele é o desenho de onde o seu corpo está compensando, e não um diagnóstico.<\/p><p>Cada ponto aceso é um checkpoint que reprovou. Dois pontos acesos em lugares distantes costumam ter a mesma origem. É por isso que eu não trato joelho de quem tem joelho ruim sem olhar o quadril dessa pessoa.<\/p><p>Se você reprovar em muitos pontos, não tente resolver tudo de uma vez. A ordem do curso existe porque a correção também tem ordem.<\/p><h4>Bloco 6: a linha de 42 dias, em três fases<\/h4><p>O curso é uma linha em três fases, e não uma lista de 12 exercícios. Cada fase existe para derrubar um motivo específico pelo qual a sua dor voltou.<\/p><table><tr><th>Dias<\/th><th>Fase<\/th><th>O que acontece<\/th><th>O motivo que ela derruba<\/th><\/tr><tr><td>1 a 14<\/td><td>1 · Destravar<\/td><td>Desarmar o modo de proteção e devolver mobilidade<\/td><td>\"Já tentei e não funcionou\"<\/td><\/tr><tr><td>15 a 28<\/td><td>2 · Estabilizar<\/td><td>Ativar o que não segurava<\/td><td>\"Melhorou e voltou\"<\/td><\/tr><tr><td>29 a 42<\/td><td>3 · Integrar<\/td><td>Levar o ganho para abaixar, carregar e dirigir<\/td><td>\"Na vida real eu não consigo\"<\/td><\/tr><\/table><h4>Por que nesta ordem<\/h4><p>Destravar vem primeiro porque não se constrói estabilidade em cima de quadril travado. Quem começa por força em base torta desiste na segunda semana, e aí confirma a crença de que já tentou e não funcionou.<\/p><p>Estabilizar vem segundo porque a mobilidade que você ganha não se sustenta sozinha. Sem estabilizador, o corpo volta ao padrão antigo em duas semanas, e é exatamente isso que faz a dor voltar.<\/p><p>Integrar vem por último porque melhorar no exercício é metade do caminho. A outra metade é pegar peso do chão, subir escada e voltar a dirigir sem medo de travar.<\/p><h4>Onde ficam os checkpoints<\/h4><table><tr><th>Fase<\/th><th>Checkpoints<\/th><\/tr><tr><td>1 · Destravar<\/td><td>1 (postura), 2 (marcha), 3 (agachamento), 4 (mobilidade)<\/td><\/tr><tr><td>2 · Estabilizar<\/td><td>5 (neural), 6 (core), 7 (unipodal)<\/td><\/tr><tr><td>3 · Integrar<\/td><td>8 (membro superior), 9 (alta demanda), 12 (Y e W)<\/td><\/tr><\/table><p>Os checkpoints 10 (MTC) e 11 (dento-neural) são apoio: não ocupam dia da linha, e você usa nos dias de dor alta.<\/p><h4>A regra dos três números<\/h4><p>Toda a linha se apoia em anotar três números por dia: dor antes, dor durante e dor no dia seguinte (24 horas). Quem anota, ajusta. Quem não anota, desiste.<\/p><p>É essa anotação que permite reconhecer oscilação como informação de carga, e não como fracasso.<\/p><p>Quarenta e dois dias é o marco de referência do método, e ele vem com critério. Cada corpo responde no seu tempo, e eu prefiro te dar um critério do que uma data.<\/p><h4>Resumo para levar<\/h4><ol><li>O lugar que dói é o lugar que paga a conta.<\/li><li>Exame normal não significa dor imaginária: significa que a foto não mostra o movimento.<\/li><li>A dor recorrente deixa um rastro no seu jeito de se mover, e esse rastro pode ser medido.<\/li><\/ol><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Módulo 2: como priorizar o seu mapa", "by": "Guia de priorização, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Você reprovou em vários checkpoints. Por qual começar, e por quê. Esta é a página que responde isso.<\/p><h4>O problema que esta página resolve<\/h4><p>Se você reprovou em dois checkpoints, a ordem do curso resolve: faça o de número menor primeiro.<\/p><p>Se você reprovou em seis ou oito, a ordem do curso não resolve. Você não pode fazer seis protocolos ao mesmo tempo, e a ordem 1 a 12 é ordem de apresentação do conteúdo, e não ordem de prioridade clínica.<\/p><p>Esta página separa as duas coisas.<\/p><h4>Camada 0: bloqueio<\/h4><p>Se aparecer sintoma neural em qualquer momento (formigamento que desce, dormência, dor em choque), você não segue o mapa. Procura avaliação.<\/p><p>Isso vale em qualquer momento do curso, e não só na triagem inicial. Sintoma novo é sinal novo.<\/p><h4>As cinco camadas, em ordem<\/h4><table><tr><th>Camada<\/th><th>O que entra<\/th><th>Por que vem nesta posição<\/th><\/tr><tr><td>0<\/td><td>Sintoma neural<\/td><td>Não é prioridade, é parada. Pode piorar com o próprio protocolo<\/td><\/tr><tr><td>1<\/td><td>Checkpoint 5 (neural) e qualquer reprovação<\/td><td>São os únicos que pioram se você errar a dose com dor acima de 3 de 10 no dia seguinte<\/td><\/tr><tr><td>2<\/td><td>Checkpoints 1, 3 e 4<\/td><td>São a origem mecânica. Corrigir a origem reduz a carga nos de cima sem tocar neles<\/td><\/tr><tr><td>3<\/td><td>Checkpoints 6 e 7<\/td><td>Estabilização. Dependem da mobilidade estar resolvida: construir core com quadril travado é construir em base torta<\/td><\/tr><tr><td>4<\/td><td>Checkpoints 8, 9 e 12<\/td><td>Integração e demanda. Exigem que as camadas de baixo estejam prontas<\/td><\/tr><tr><td>5<\/td><td>Checkpoints 10 e 11<\/td><td>Apoio. Não entram na fila de prioridade: são transversais<\/td><\/tr><\/table><h4>Camada não é a mesma coisa que fase<\/h4><p>Isso confunde, e vale esclarecer antes de você usar a regra.<\/p><p>Fase é a ordem em que o curso apresenta. Camada é a ordem em que você resolve.<\/p><p>As duas são verdadeiras ao mesmo tempo porque respondem perguntas diferentes. A fase organiza o conteúdo em 42 dias: você vê o checkpoint 5 na fase 2 porque ele é o único que piora se a dose estiver errada, e chega nele depois de aprender a dosar nos checkpoints 1 a 4. A camada organiza a prioridade clínica: se você reprovou no 5, ele vem antes de tudo, porque sintoma neural não espera a fila do curso.<\/p><p>Na prática: se você reprovou no 5 e em outros, comece pelo 5, ainda que o curso o apresente depois. Se você não reprovou no 5, siga a ordem das fases normalmente.<\/p><h4>A regra em uma frase<\/h4><p>Sintoma neural primeiro. Origem mecânica depois. Estabilização em terceiro. Demanda por último. Apoio não entra na fila.<\/p><h4>Como aplicar, na prática<\/h4><ol><li>Monte a sua lista de reprovados.<\/li><li>Marque qual camada cada um pertence.<\/li><li>Comece pela camada de número menor.<\/li><li>Dentro da mesma camada, siga a ordem do curso (o de número menor primeiro).<\/li><li>Faça um protocolo por vez, e só abra o seguinte quando o atual estiver no critério.<\/li><\/ol><h4>O caso de quem reprovou em tudo<\/h4><p>Se você reprovou em 8 ou mais checkpoints, esta é a sua situação:<\/p><p>Você não tem oito problemas. Você tem um padrão que aparece em oito lugares.<\/p><p>Nesse caso, a ordem muda de lógica: você não vai tratar cada checkpoint, vai tratar a origem. E a origem quase sempre está na camada 2: a coluna de cima travada (checkpoint 1), a dorsiflexão limitada (checkpoint 3) e o flexor do quadril curto (checkpoint 4).<\/p><p>O caminho para 8 ou mais reprovações, seguindo a ordem das camadas:<\/p><table><tr><th>Semanas<\/th><th>O que fazer<\/th><th>Por quê<\/th><\/tr><tr><td>1a4<\/td><td>Checkpoint 4 (mobilidade) e checkpoint 1 (postura). Nada de<\/td><td>Só destravar. Refaça os testes ao fim de<\/td><\/tr><tr><td>força, nada de salto<\/td><td>cada semana<\/td><\/tr><tr><td>5a8<\/td><td>Checkpoint 3 (agachamento) e checkpoint 7 (unipodal)<\/td><td>Com mobilidade melhor, a estabilização começa a pegar<\/td><\/tr><tr><td>9 a 12<\/td><td>Checkpoints 6, 8 e o restante. Refaça o mapa completo<\/td><td>Integrar o que foi destravado e estabilizado<\/td><\/tr><\/table><p>O que esperar: é comum que, ao destravar a camada 2, três ou quatro checkpoints de cima passem sozinhos. Foi a sobrecarga que os reprovava, e não uma falha daquela estrutura.<\/p><p>E o que fazer com os checkpoints 10 e 11 nesse caso: use como apoio nos dias de dor alta, e não como tarefa. Eles não são o caminho, são o alívio do caminho.<\/p><h4>Sobre a ordem do curso e a ordem de prioridade<\/h4><p>Existe uma coisa que pode te travar, e é melhor você saber antes.<\/p><p>O curso libera os checkpoints em sequência: o quiz do 1 abre o 2, o do 2 abre o 3, e assim por diante. Mas a regra de camadas manda tratar o sintoma neural primeiro, e o neural é o checkpoint 5.<\/p><p>A solução que eu adotei: o checkpoint 5 tem uma exceção. Se você marcar sintoma neural em qualquer momento (formigamento que desce, dormência, dor em choque), o checkpoint 5 abre imediatamente, fora de ordem, com um aviso na tela.<\/p><p>A exceção existe por um motivo só: o 5 é o único checkpoint que piora se você esperar a fila. Todos os outros seguem a sequência normal.<\/p><p>Então, na prática:<\/p><table><tr><th>Situação<\/th><th>O que fazer<\/th><\/tr><tr><td>Você tem sintoma neural<\/td><td>O checkpoint 5 abre fora de ordem. Comece por ele<\/td><\/tr><tr><td>Você não tem sintoma neural<\/td><td>Siga a sequência do curso normalmente<\/td><\/tr><tr><td>Você quer priorizar por camada<\/td><td>Você não consegue, e isso é de propósito: a sequência existe para você aprender<\/td><\/tr><tr><td>sem ter sintoma neural<\/td><td>a dosar antes de chegar nos checkpoints de maior carga<\/td><\/tr><\/table><p>Uma coisa que esta página não faz Ela não transforma o seu mapa em diagnóstico. Se você reprovar em muitos pontos e sentir que o corpo inteiro está comprometido, o certo é uma avaliação presencial, e não mais protocolo em casa. Me manda uma mensagem e a gente vê isso junto.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Protocolo de crise: 15 minutos", "by": "Módulo de apoio, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O que fazer quando a dor está alta. Este módulo não tenta resolver a crise: ele baixa o suficiente para você conseguir dormir.<\/p><h4>Antes de começar: qual é o seu nível<\/h4><table><tr><th>Nível<\/th><th>Dor<\/th><th>O que fazer<\/th><\/tr><tr><td>1<\/td><td>Até 4<\/td><td>Você consegue se movimentar. Siga os cinco passos<\/td><\/tr><tr><td>2<\/td><td>De 5 a 7<\/td><td>Você se move com cuidado. Siga os cinco passos com amplitude menor<\/td><\/tr><tr><td>3<\/td><td>Acima de 7, ou dor nova e forte<\/td><td>Não faça este protocolo. Procure atendimento presencial<\/td><\/tr><\/table><p>Se você tem qualquer sinal da triagem, este módulo não é para você.<\/p><h4>Os cinco passos<\/h4><p>Passo 1, respiração (2 minutos). Quatro segundos inspirando pelo nariz, seis segundos soltando pela boca. Nada mais.<\/p><p>Passo 2, posição de alívio (3 minutos). A posição que mais alivia a sua região. As quatro posições estão no vídeo.<\/p><p>Passo 3, movimento suave (2 minutos). Sem carga, dentro do que não dói.<\/p><p>Passo 4, calor ou frio (5 minutos). O que você já sabe que funciona para você.<\/p><p>Passo 5, anotar. Dor antes, o que fez, dor depois.<\/p><h4>O que não fazer<\/h4><ul><li>Não alongue com força<\/li><li>Não faça o protocolo completo<\/li><li>Não tome remédio por conta própria além do já prescrito para você<\/li><li>Não fique na cama o dia inteiro<\/li><\/ul><p>Este último é o mais importante. Ficar na cama parece a coisa mais segura e é a que mais atrasa a recuperação. O corpo precisa de movimento suave, e não de repouso absoluto.<\/p><h4>Quando me procurar<\/h4><p>Se a crise não ceder em 72 horas, ou se piorar, me manda mensagem. Não espere a semana passar.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Kinesio tape: como aplicar", "by": "Módulo de apoio, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Uma ajuda de curto prazo. A fita lembra o corpo de uma posição, e a correção vem do exercício.<\/p><h4>O que a fita faz e o que ela não faz<\/h4><p>A fita lembra o seu corpo, por algumas horas, de uma posição que ele esqueceu. Ela não corrige a sua postura e não trata a causa.<\/p><p>Se você usar a fita e não fizer o exercício, você não vai melhorar. A fita é a muleta; o exercício é a reabilitação.<\/p><h4>As quatro aplicações principais<\/h4><table><tr><th>Região<\/th><th>Formato<\/th><th>Tensão<\/th><th>Como<\/th><\/tr><tr><td>Lombar<\/td><td>Duas tiras em paralelo<\/td><td>Leve<\/td><td>Do sacro para cima, sem esticar muito o centro<\/td><\/tr><tr><td>Joelho<\/td><td>Tira em U ou em Y<\/td><td>15 a 25%<\/td><td>Contornando a patela, sem encostar nela<\/td><\/tr><tr><td>Ombro e escápula<\/td><td>Tira do deltoide à escápula<\/td><td>25 a 50%<\/td><td>Acompanhando a retração<\/td><\/tr><tr><td>Pescoço<\/td><td>Tira leve<\/td><td>Leve<\/td><td>Do trapézio superior à base do crânio<\/td><\/tr><\/table><h4>Regras de aplicação<\/h4><ol><li>Pele limpa e seca. Sem creme, sem suor.<\/li><li>Não estique demais: a fita acompanha o movimento, não limita.<\/li><li>Nunca deixe mais de cinco dias. A pele precisa descansar.<\/li><li>Se a pele ficar vermelha, coçar ou empolar, retire. Alergia a adesivo acontece.<\/li><\/ol><h4>Quando usar<\/h4><p>Nos dias de dor alta, para conseguir fazer o exercício. E durante o dia, para manter a consciência do movimento.<\/p><p>Não use todos os dias por semanas. O objetivo é que você deixe de precisar.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Reavaliação semanal: as três perguntas", "by": "Módulo de apoio, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O que faz o protocolo continuar funcionando depois da primeira semana. Cinco minutos, uma vez por semana.<\/p><h4>As três perguntas<\/h4><ol><li>Quantos dias desta semana você fez o protocolo? (de 7)<\/li><li>A dor subiu, desceu ou ficou igual?<\/li><li>Qual exercício você pulou?<\/li><\/ol><p>Anote num caderno ou no celular. Sem anotação, você vai lembrar do pior dia e esquecer de todo o resto: a memória é uma péssima avaliadora.<\/p><h4>O que fazer com cada resposta<\/h4><table><tr><th>Sinal<\/th><th>Leitura<\/th><th>Ação<\/th><\/tr><tr><td>Fez 5 a 7 dias<\/td><td>Em ritmo<\/td><td>Reforce e avance uma fase<\/td><\/tr><tr><td>Fez 3 a 4 dias<\/td><td>Escorregando<\/td><td>Descubra qual dia caiu e por quê. Reduza o protocolo para caber na rotina<\/td><\/tr><tr><td>Fez 0 a 2 dias<\/td><td>Abandono em curso<\/td><td>Não se cobre. Me diga o que travou. Se foi tempo, corta pela metade. Se foi dor, recua uma fase. Se não entendeu o exercício, troca o exercício<\/td><\/tr><tr><td>Dor subiu<\/td><td>Pode ser resposta normal<\/td><td>Recue uma semana. Se persistir duas semanas, me mande mensagem ou excesso de carga<\/td><\/tr><tr><td>Dor igual<\/td><td>Platô<\/td><td>Verifique a execução antes de aumentar carga<\/td><\/tr><tr><td>Pulou sempre<\/td><td>Aquele movimento tem<\/td><td>Ele entra na hierarquia de medo, e não no fim da fila<\/td><\/tr><tr><td>o mesmo<\/td><td>medo ou tem dor<\/td><\/tr><\/table><h4>A parte que ninguém explica<\/h4><p>A oscilação da dor é informação sobre carga, e não sinal de que você está falhando.<\/p><p>Quem trata a oscilação como fracasso desiste na terceira semana. Quem trata como ajuste continua por meses, e é aí que o resultado aparece.<\/p><p>A maioria das pessoas com dor crônica abandona o programa domiciliar, e os motivos são conhecidos: a dor oscilou, ela perdeu a confiança e ninguém estava acompanhando. As três perguntas existem para cobrir os três.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Auditoria individual: como usar", "by": "Módulo de apoio, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Você tem quatro auditorias depois de uma semana, um mês, dois meses e três meses. Muita gente compra e não usa.<\/p><h4>Como funciona<\/h4><ol><li>Filme o checkpoint que quer revisar, com o celular, do mesmo jeito que fez no teste.<\/li><li>Abra o exercício e envie o vídeo. Não precisa editar nem ser bonito: precisa ser honesto.<\/li><li>Eu olho e respondo em vídeo, apontando o que vi, onde está o erro, o que ajustar e se você pode avançar.<\/li><\/ol><h4>O que eu não faço<\/h4><p>Eu não vou te dar diagnóstico nem prescrição por vídeo. Vou te dizer o que o critério mostra. Se eu identificar algo que precisa de avaliação presencial, vou te dizer isso com todas as letras.<\/p><h4>O uso que mais funciona<\/h4><p>Use a auditoria quando estiver travado, e não só quando estiver bem.<\/p><p>Quem manda vídeo do exercício que já está certo desperdiça a auditoria. Quem manda o que está difícil é quem muda o resultado.<\/p><h4>Os quatro momentos<\/h4><table><tr><th>Quando<\/th><th>O que mandar<\/th><\/tr><tr><td>1 semana<\/td><td>O teste que mais te surpreendeu no resultado<\/td><\/tr><tr><td>1 mês<\/td><td>O exercício que você mais pulou<\/td><\/tr><tr><td>2 meses<\/td><td>O checkpoint que não fecha por nada<\/td><\/tr><tr><td>3 meses<\/td><td>A sua reavaliação completa dos 12<\/td><\/tr><\/table><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Encerramento: depois da linha de 42 dias", "by": "Módulo de apoio, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O que muda, o que você faz para manter, e o que fazer se a dor voltar.<\/p><h4>O que você construiu<\/h4><table><tr><th>Dias<\/th><th>Fase<\/th><th>O que você fez<\/th><\/tr><tr><td>1 a 14<\/td><td>Destravar<\/td><td>Desarmou a proteção e aprendeu a se mover de novo<\/td><\/tr><tr><td>15 a 28<\/td><td>Estabilizar<\/td><td>Ativou o que não segurava<\/td><\/tr><tr><td>29 a 42<\/td><td>Integrar<\/td><td>Levou o ganho para abaixar, carregar, subir escada e dirigir<\/td><\/tr><\/table><p>Se você fez a linha inteira, o que muda vai além da dor: muda o que você voltou a fazer.<\/p><h4>A manutenção<\/h4><p>O que você construiu precisa de uso para continuar. O corpo devolve o que ele não recebe.<\/p><ul><li>Caminhada três vezes por semana<\/li><li>Os exercícios do checkpoint que mais reprovou, duas vezes por semana<\/li><li>Reavaliação a cada três meses, com o quiz e os testes principais<\/li><\/ul><p>Se a dor voltar Você não começa do zero. Volta ao checkpoint que reprovou e refaz. Agora você tem um mapa, e mapa é o que faltava na primeira vez.<\/p><h4>Uma coisa que eu peço<\/h4><p>Me conta o que você voltou a fazer. Não a nota da dor: o que você voltou a fazer.<\/p><p>Porque era isso que eu queria quando comecei esse método. É o que faz dezenove anos valerem a pena.<\/p><p>Obrigado por confiar em mim o seu corpo. Eu não tratei o seu sintoma: eu te ensinei a ler o seu corpo.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 1: postura estática", "by": "Checkpoint 1 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O teste começa parado, na parede. É ali que o corpo mostra onde já desistiu de sustentar.<\/p><h4>O que este checkpoint mede<\/h4><p>Quatro pontos de contato com a parede (calcanhares, glúteos, omoplatas e parte de trás da cabeça), e três desvios: cabeça à frente, ombros rodados, lombar muito arqueada ou muito reta.<\/p><h4>Como fazer o teste<\/h4><ol><li>Cole uma fita no chão a cerca de 10 cm da parede: é a sua marca de calcanhar.<\/li><li>Encoste de costas, com os calcanhares na fita.<\/li><li>Encoste na ordem: glúteos, omoplatas e parte de trás da cabeça. De baixo para cima.<\/li><li>Sustente 5 segundos, respirando normal.<\/li><li>Filme de perfil, na altura do seu quadril, com o corpo inteiro no enquadramento.<\/li><\/ol><p>A ordem de baixo para cima importa. Encostar tudo de uma vez faz o corpo escolher o que encostar e esconder o resto.<\/p><h4>O que conta como passou<\/h4><ul><li>Os quatro pontos encostam sem você empurrar<\/li><li>Você consegue falar uma frase inteira nessa posição<\/li><li>A cabeça não está à frente do ombro<\/li><li>A lombar mantém uma curva natural pequena<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Reeducação Postural Ativa (Postural Correction Drills)<\/h4><p>O que fazer<\/p><p>Você se posiciona de costas para uma parede, com calcanhares, glúteos, omoplatas e occipital em contato com a parede. Realiza a sequência: (1) chin tuck (retração cervical: leve movimento do queixo para trás, sem inclinar a cabeça), sustentando 5 segundos; (2) shoulder blade squeeze (retração escapular: apertar as escápulas uma contra a outra), sustentando 5 segundos; (3) pelvic tilt correction (encontrar a pelve neutra: inclinar a pelve anteriormente e posteriormente até encontrar o ponto médio), sustentando 5 segundos; (4) ribcage-to-pelvis alignment (alinhar as últimas costelas com a pelve, ativando o transverso: puxar o umbigo levemente para dentro). Realizar 10 ciclos completos, 2x ao dia.<\/p><h6>O que conferir<\/h6><ul><li>Todos os 4 pontos de contato (calcanhares, glúteos, omoplatas, occipital) permanecem na parede durante toda a sequência<\/li><li>O chin tuck não causa dor cervical<\/li><li>A retração escapular não eleva os ombros (o trapézio superior não deve ser o músculo primário)<\/li><li>A pelve neutra é encontrada e mantida<\/li><li>O transverso é ativado sem prender a respiração<\/li><\/ul><h4>Digitopressão: Pontos Sistêmicos para Postura<\/h4><p>O que fazer<\/p><p>Você aplica pressão digital firme (não dolorosa) nos pontos descritos abaixo, sustentando 30-60 segundos por ponto, com pressão intermitente (pressão 5s, alívio 2s). Realizar 2x ao dia. Pontos: BP6 (Baço-Pâncreas 6: Sanyinjiao): Localização: Face medial da perna, 4 dedos acima do maléolo medial, na borda posterior da tíbia Função postural: Fortalece o Baço (governa a musculatura), tonifica o Qi geral, melhora o tônus muscular postural Indicação: Postura com fraqueza muscular generalizada, fadiga postural, pé plano E36 (Estômago 36: Zusanli): Localização: 4 dedos abaixo da patela, um dedo lateral à crista tibial anterior Função postural: Tonifica o Qi do Estômago (fonte de energia pós-natal), fortalece a musculatura dos membros inferiores, melhora a resistência postural Indicação: Fadiga postural, pernas cansadas, anterior pelvic tilt com fraqueza de quadríceps B23 (Bexiga 23: Shenshu): Localização: 2 dedos laterais ao processo espinhoso de L2 (na altura da última costela) Função postural: Tonifica o Rim (governa ossos e medula), fortalece a coluna lombar, melhora a estabilidade lombopélvica Indicação:Anterior pelvic tilt, dor lombar postural, hipermobilidade lombar VG20 (Vaso Governador 20: Baihui): Localização: Topo da cabeça, na interseção da linha média com a linha que conecta os ápices das orelhas Função postural: Eleva o Yang, clarifica a mente, melhora a consciência postural (o “eixo” do corpo) Indicação:Forward head, tontura postural, falta de consciência corporal<\/p><h6>O que conferir<\/h6><ul><li>Pressão firme mas não dolorosa (escala 5-7 de 10)<\/li><li>Sensação de De Qi (leve dor surda, formigamento ou calor) indica ativação correta<\/li><li>Simetria bilateral nos pontos pares<\/li><li>Não pressionar sobre lesões cutâneas, hematomas ou inflamações<\/li><\/ul><p>Digitopressão Auricular: Pontos Posturais O que fazer<\/p><p>Você utiliza a ponta do dedo polegar ou indicador para massagear os pontos auriculares em movimentos circulares (sentido horário), com pressão firme, 30 segundos por ponto, 2-3x ao dia. A orelha deve ser limpa com álcool antes da estimulação. Pontos: Ponto da Coluna Vertebral (Auricular): Localização: Na crista da anti- hélix, que corresponde à coluna vertebral. A porção superior = cervical, média = torácica, inferior = lombar Função: Estimula a inervação segmentar da coluna, melhora o tônus paravertebral Técnica: Massagear de cima para baixo (cervical → lombar) para “descer a energia” Ponto do Pescoço (Auricular): Localização: Na depressão entre a crura da hélix e a cavidade concha, na parede posterior Função: Relaxa a musculatura cervical posterior, alivia tensão postural Ponto Lombar (Auricular): Localização: Na porção inferior da anti- hélix, abaixo do ponto da coluna torácica Função: Relaxa a musculatura lombar, alivia tensão postural Ponto Shen Men (Porta do Espírito): Localização: Na porção superior da cavidade concha (triângulo da
