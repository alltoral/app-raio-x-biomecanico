ga o resultado sem ele.<\/p><h4>O que este checkpoint mede<\/h4><p>Hop test e drop jump. Como você aterrissa, e se os dois lados respondem igual.<\/p><h4>Como fazer o teste<\/h4><p>Hop test: em uma perna, salte para frente e caia na mesma perna. Meça a distância. Faça os dois lados.<\/p><p>Drop jump: de cima de um degrau baixo, caia com as duas pernas e estabilize.<\/p><p>Filme de frente: o que importa é o que acontece na aterrissagem.<\/p><h4>O que conta como passou<\/h4><ul><li>Mesma distância nos dois lados (diferença até 10%)<\/li><li>Joelho alinhado na aterrissagem<\/li><li>Aterrissagem silenciosa<\/li><li>Sem perda de equilíbrio<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Box Jumps (Saltos na Caixa)<\/h4><p>O que fazer<\/p><p>Você em pé, frente a uma caixa (caixa firme) de 30-50 cm. Realiza um salto vertical, aterrissando sobre a caixa com ambos os pés simultaneamente, com flexão controlada de quadril, joelho e tornozelo. Desce passo a passo (não salta para baixo). 3 séries de 5 saltos.<\/p><h6>O que conferir<\/h6><ul><li>A aterrissagem acontece com os dois pés ao mesmo tempo<\/li><li>Os joelhos permanecem alinhados, sem cair para dentro<\/li><li>A aterrissagem é silenciosa: barulho indica falta de amortecimento<\/li><li>A descida da caixa é feita passo a passo, nunca saltando de volta<\/li><li>A caixa tem entre 30 e 50 cm e o salto é feito com segurança ao redor<\/li><\/ul><p>Drop Landing (Aterrissagem Controlada) O que fazer<\/p><p>Você se posiciona sobre uma caixa de 30 cm. Desce da caixa (sem pular: step off) e aterrissa com ambos os pés simultaneamente, com flexão profunda e controlada de quadril, joelho e tornozelo. A aterrissagem deve ser amortecida (flexão profunda) e silenciosa. 3 séries de 5 aterrissagens.<\/p><h6>O que conferir<\/h6><ul><li>A saída da caixa é um passo à frente, sem salto<\/li><li>A aterrissagem acontece com os dois pés simultâneos<\/li><li>O quadril, o joelho e o tornozelo flexionam de forma profunda e controlada<\/li><li>Os joelhos ficam alinhados com os pés, sem valgo<\/li><li>Não há som alto na aterrissagem nem perda de equilíbrio<\/li><\/ul><h4>Single Leg Box Jump<\/h4><p>O que fazer<\/p><p>Você em pé sobre uma perna, frente a uma caixa baixa (20-30 cm). Realiza um salto unipodal, aterrissando sobre a caixa com o mesmo pé. 3 séries de 5 saltos, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O salto é feito e a aterrissagem acontece no mesmo pé<\/li><li>O joelho da perna de apoio permanece alinhado, sem cair para dentro<\/li><li>O pé não escorrega na caixa<\/li><li>A descida é feita com controle, sem saltar de volta<\/li><li>A caixa tem entre 20 e 30 cm<\/li><\/ul><h4>Single Leg Stand on Unstable Surface<\/h4><p>O que fazer<\/p><p>Você em pé sobre uma perna, em uma superfície instável (travesseiro, superfície macia, ou almofada firme). Sustenta 30 segundos, 3 séries, bilateral. Progressão: olhos fechados, superfície mais instável, superfície em movimento (wobble board).<\/p><h6>O que conferir<\/h6><ul><li>Os 30 segundos são cumpridos sem tocar o chão com a outra perna<\/li><li>O tronco não balança de forma ampla para manter o equilíbrio<\/li><li>O joelho de apoio permanece alinhado, sem cair para dentro<\/li><li>O pé não agarra com os dedos de forma excessiva<\/li><li>A progressão só avança quando os 30 segundos saem fáceis<\/li><\/ul><h4>Single Leg Reach (Alcance Unipodal)<\/h4><p>O que fazer<\/p><p>Você em pé sobre uma perna. Com a perna livre, alcança em três direções: frente, lateral e trás (similar ao YBT, mas em pé). O joelho de apoio deve permanecer estável (sem valgus). 3 séries de 5 alcances em cada direção, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O joelho de apoio permanece estável, sem valgo, nas três direções<\/li><li>Os 5 alcances por direção são cumpridos sem tocar o chão<\/li><li>O tronco acompanha o movimento sem desabar lateralmente<\/li><li>A pelve permanece nivelada<\/li><li>O pé de apoio não sai do lugar<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Cair com o joelho para dentro. É o sinal de que a base não está pronta para essa carga.<\/li><li>Cair duro, sem dobrar joelho e quadril. O impacto vai para a articulação.<\/li><li>Perder o equilíbrio e dar um passo. Conta como reprovado.<\/li><li>Saltar de volta da caixa. É onde a maioria das lesões acontece em treino de salto.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é potência e propriocepção, em progressão de quatro níveis.<\/p><p>Aqui a regra de segurança vale mais do que em qualquer outro lugar: dor acima de 3 de 10 significa voltar um nível. E se você respondeu sim a algum sinal da triagem, não faça este checkpoint: pule e fale comigo.<\/p><h4>Perguntas frequentes<\/h4><p>Tenho medo de saltar. Devo pular este?<\/p><p>Se o medo te impede de aterrissar com controle, sim. Faça o checkpoint 7 primeiro e volte.<\/p><h5>Preciso de caixa de salto?<\/h5><p>Um degrau firme de 20 a 30 cm serve. Nunca use banquinho instável.<\/p><h5>Meu joelho inchou depois. O que fazer?<\/h5><p>Recue dois níveis e me mande mensagem. Inchaço é sinal de carga acima do que a articulação tolera.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}];

    var prox = proximo() ? cp(proximo()) : null;
    var wrap = document.createElement('div');
    wrap.innerHTML = '<div class="confete" aria-hidden="true">'+Array.from({length:36},function(_,i){ var cores=['#D4A017','#EEC452','#F6F3EC','#8A6810']; return '<i style="left:'+(Math.random()*100)+'%;background:'+cores[i%4]+';animation-delay:'+(Math.random()*.4)+'s;animation-duration:'+(1.2+Math.random()*.9)+'s"></i>'; }).join('')+'</div>'+
      '<div class="cel-fundo" role="dialog" aria-modal="true" aria-labelledby="cel-t"><div class="cel">'+
        '<span class="medalha">'+ic.medalha+'</span><span class="rotulo">Checkpoint '+pad(c.n)+'</span><h2 id="cel-t">Concluído!</h2>'+
        '<p>Quiz aprovado e exercício de hoje registrado no seu calendário. Sequência: '+sequencia()+' dias.</p>'+
        (prox ? '<div class="liberado"><img src="assets/'+prox.img+'.jpg" alt=""><div><small>LIBERADO</small><b>'+prox.t+'</b></div></div><button class="continuar" id="cel-ir">Ir para o próximo '+ic.seta+'</button>' : '<button class="continuar" id="cel-ir">Ver minha jornada</button>')+
        '<button class="reset" id="cel-fechar" style="margin-top:4px">Voltar ao início</button>'+
      '</div></div>';
    document.body.appendChild(wrap);
    var ok = document.getElementById('cel-ir'); ok.focus();
    function fechar(dest){ wrap.remove(); if (dest) ir('aula', dest); else ir('inicio'); }
    ok.addEventListener('click', function(){ fechar(prox ? prox.n : null); });
    document.getElementById('cel-fechar').addEventListener('click', function(){ fechar(null); });
    setTimeout(function(){ var cf=wrap.querySelector('.confete'); if (cf) cf.remove(); }, 2600);
  }

  function desenhar(){
    var t=E.tela;
    if (t==='quiz' && !Q) t=E.tela='aula';
    app.innerHTML = t==='aula' ? telaAula() : t==='quiz' ? (Q.i>=7 ? telaResultado() : telaQuiz()) : t==='calendario' ? telaCal() : t==='crise' ? telaCrise() : t==='triagem' ? telaTriagem() : t==='modulo' ? telaModulo() : telaInicio();
    desenharAbas(); ligar();
  }
  function marcarDia(){ if (E.dias.indexOf(HOJE)<0) E.dias.push(HOJE); }
  function ligar(){
    document.querySelectorAll('[data-ir]').forEach(function(b){ b.onclick=function(){ E.mes=null; Q=null; ir(b.getAttribute('data-ir')); }; });
    app.querySelectorAll('[data-cp]').forEach(function(b){ b.onclick=function(){ ir('aula', +b.getAttribute('data-cp')); }; });
    app.querySelectorAll('[data-mod]').forEach(function(b){ b.onclick=function(){ E.mod=b.getAttribute('data-mod'); ir('modulo'); }; });
    app.querySelectorAll('[data-bloq]').forEach(function(b){ b.onclick=function(){ b.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260}); }; });
    app.querySelectorAll('[data-sair-quiz]').forEach(function(b){ b.onclick=function(){ Q=null; ir('aula'); }; });
    app.querySelectorAll('[data-nota]').forEach(function(b){ b.onclick=function(){ var n=E.cp; if (!E.notas[HOJE]) E.notas[HOJE]={}; if (!E.notas[HOJE][n]) E.notas[HOJE][n]={}; E.notas[HOJE][n][b.getAttribute('data-nota')]=+b.getAttribute('data-v'); salvar(); var y=window.scrollY; desenhar(); window.scrollTo(0,y); }; });
    app.querySelectorAll('[data-zoom]').forEach(function(b){ b.onclick=function(){ var w=document.createElement('div'); w.className='zoom'; w.setAttribute('role','dialog'); w.innerHTML='<img src="'+b.getAttribute('data-zoom')+'" alt=""><button aria-label="Fechar">×</button>'; w.onclick=function(){ w.remove(); }; document.body.appendChild(w); }; });
    var iq=document.getElementById('ir-quiz'); if (iq) iq.onclick=function(){ Q=montarQuiz(E.cp); ir('quiz'); };
    app.querySelectorAll('[data-op]').forEach(function(b){ b.onclick=function(){ if (Q.resp!==null) return; var k=+b.getAttribute('data-op'), q=Q.qs[Q.i]; Q.resp=k; if (k===q.c) Q.ac++; else if (q.s) Q.segErro=true; desenhar(); var ex=app.querySelector('.explica'); if (ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'}); }; });
    var qp=document.getElementById('q-prox'); if (qp) qp.onclick=function(){ Q.i++; Q.resp=null; if (Q.i>=7){ var ok=Q.ac>=5&&!Q.segErro; E.quiz[Q.n]={ac:Q.ac, ok:ok || (E.quiz[Q.n]&&E.quiz[Q.n].ok) || false}; salvar(); } desenhar(); window.scrollTo(0,0); };
    var qd=document.getElementById('q-de-novo'); if (qd) qd.onclick=function(){ Q=montarQuiz(Q.n); desenhar(); window.scrollTo(0,0); };
    var qf=document.getElementById('q-fim'); if (qf) qf.onclick=function(){ var c=cp(Q.n); Q=null;
      if (APOIO_CP.indexOf(c.n)>-1){ if (E.apoioOk.indexOf(c.n)<0) E.apoioOk.push(c.n); ir('inicio'); return; }
      var novo = E.feitos.indexOf(c.n)<0; if (novo) E.feitos.push(c.n); marcarDia(); E.tela='aula'; salvar(); desenhar(); if (novo) celebrar(c); };
    var to=document.getElementById('tri-ok'); if (to) to.onclick=function(){ var r=[]; for (var i=0;i<7;i++){ var x=app.querySelector('input[name=tq'+i+']:checked'); r.push(x?x.value:null); }
      if (r.indexOf(null)>-1){ document.getElementById('erro-tri').hidden=false; return; }
      E.triagem = r.indexOf('s')>-1 ? 'suspenso' : 'ok'; if (E.triagem==='ok' && !E.inicio) E.inicio=HOJE; ir('inicio'); };
    var go=document.getElementById('gate-ok'); if (go) go.onclick=function(){ var r=[]; for (var i=0;i<7;i++){ var x=app.querySelector('input[name=g'+i+']:checked'); r.push(x?+x.value:null); }
      if (r.indexOf(null)>-1){ document.getElementById('erro-tri').hidden=false; return; }
      var ok = r.every(function(v){return v===0;}); var ate=new Date(hoje); ate.setDate(ate.getDate()+28);
      E.gate9 = ok ? {ok:true} : {ok:false, ate:iso(ate)}; salvar(); desenhar(); window.scrollTo(0,0); };
    app.querySelectorAll('[data-mes]').forEach(function(b){ b.onclick=function(){ var base = E.mes ? new Date(E.mes+'-01T12:00:00') : new Date(hoje.getFullYear(), hoje.getMonth(), 1, 12); base.setMonth(base.getMonth()+(+b.getAttribute('data-mes'))); E.mes=base.getFullYear()+'-'+pad(base.getMonth()+1); salvar(); desenhar(); }; });
    var rs=document.getElementById('reset'); if (rs) rs.onclick=function(){ E=exemplo(); E.triagem=null; E.tela='inicio'; salvar(); desenhar(); };
  }
  desenhar();
})();
</script>
