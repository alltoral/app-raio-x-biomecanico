fossa triangular) Função: Acalma o sistema nervoso, reduz a tensão postural induzida por estresse O que conferir<\/p><ul><li>O ponto está localizado no lugar descrito: crista da anti-hélix (coluna), depressão entre a crura da hélix (pescoço), porção inferior da anti-hélix (lombar)<\/li><li>A pressão é firme e não provoca dor: se doer, a força foi excessiva<\/li><li>Cada ponto recebe 30 segundos, cronometrados<\/li><li>A pele da orelha está limpa e seca antes da estimulação<\/li><li>Não há vermelhidão intensa nem escoriação ao terminar<\/li><\/ul><h4>Kinesio Tape: Aplicação Postural<\/h4><p>O que fazer<\/p><p>Você (ou um ajudante) aplica a bandagem de kinesio tape nas configurações abaixo. A tensão do tape deve ser 15-25% (correção de fascia/músculo). As aplicações devem ser renovadas a cada 3-5 dias. Aplicações: Aplicação 1: Correção de Forward Head (Trapezio Superior / Elevador da Escápula): Posicionamento: Você sentado, com a cabeça em retração leve (chin tuck) Tape: Tira em “Y” invertido, com a base na protuberância occipital e os ramos descendo sobre o trapézio superior (bilateral) Tensão: 15-25% nos ramos, 0% na base (âncora) Objetivo: Inibir a hipertonicidade do trapézio superior, facilitar a retração cervical Aplicação 2: Correção de Rounded Shoulders (Peitoral): Posicionamento: Você sentado, com os ombros em retração leve Tape: Tira em “I”, da clavícula (origem do peitoral) em direção ao úmero (inserção), bilateral Tensão: 15-25% (facilitação inibitória do peitoral) Objetivo: Inibir o peitoral encurtado, facilitar a abertura torácica Aplicação 3: Correção de Anterior Pelvic Tilt (Abdominais): Posicionamento: Você em pé, em leve posterior pelvic tilt Tape: Tira em “I” horizontal, de uma EIAS à outra (sobre o baixo ventre) Tensão: 25% (facilitação do transverso) Objetivo: Facilitar a ativação do transverso do abdome, proporcionar proprioceptive cue para posterior tilt Objetivo geral: Utilizar o kinesio tape como feedback proprioceptivo contínuo que “lembra” o corpo da postura correta durante as atividades diárias.<\/p><h6>O que conferir<\/h6><ul><li>A pele deve estar limpa, seca e sem pelos excessivos (depilar se necessário)<\/li><li>As bordas do tape devem ser arredondadas (evita descolamento prematuro)<\/li><li>A âncora (extremidade sem tensão) deve ser aplicada primeiro<\/li><li>O tape não deve causar dor, coceira severa ou vermelhidão<\/li><li>O avaliado deve conseguir mover normalmente com o tape aplicado<\/li><\/ul><p>Erros comuns<\/p><ul><li>Queixo para cima para encostar a cabeça. Isso é extensão da cervical: o teste vira teatro.<\/li><li>Levantar os ombros para encostar as omoplatas. Quem encostou foi o trapézio, não a escápula.<\/li><li>Apertar a barriga para esconder a lombar. Você não está testando a lombar, está testando sua capacidade de escondê-la.<\/li><li>Segurar com força e chamar de postura. Postura que precisa de força é uma pose.<\/li><\/ul><h4>Se você reprovou<\/h4><p>Faça o protocolo de reeducação postural ativa, duas vezes ao dia, dez ciclos.<\/p><p>O ganho não vem do exercício em si: vem de você aprender a reconhecer a posição neutra e voltar a ela durante o dia. Cinco ou seis vezes por dia, sempre que lembrar: encontre a posição e solte. Quando a posição neutra virar a sua posição normal, o teste passa sozinho.<\/p><h4>Perguntas frequentes<\/h4><p>Preciso de parede lisa?<\/p><p>Sim. Rodapé alto ou bagunça atrás do corpo atrapalha o contato dos calcanhares e dos glúteos.<\/p><h5>E se eu não conseguir encostar a cabeça de jeito nenhum?<\/h5><p>Isso é resultado, não erro de execução. Marque como reprovado.<\/p><h5>Quanto tempo até passar?<\/h5><p>Depende de quanto tempo você passa sentado. Quem trabalha oito horas sentado costuma levar de duas a quatro semanas.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 10: testes manuais e MTC", "by": "Checkpoint 10 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>A parte que precisa da sua leitura mais cuidadosa. Recursos de conforto e adesão, e não de cura.<\/p><p>Leia antes de fazer: este módulo é demonstração educativa, e não prescrição.<\/p><p>O que está aqui é a lógica de uma prática que eu uso há dezenove anos, apresentada para você entender o raciocínio. Serve para você entender o raciocínio, e não substitui atendimento profissional.<\/p><p>O que você pode fazer em casa com segurança: automassagem leve nos pontos indicados, com pressão firme e não dolorosa, como recurso de conforto nos dias de dor alta.<\/p><p>O que você não deve fazer com base neste material: tratar sintomas viscerais, usar ponto no lugar de avaliação médica, ou aplicar em outra pessoa sem formação.<\/p><p>A pergunta que fica para a versão comercial: a prática de digitopressão e de reflexologia é privativa de profissional habilitado na leitura do seu conselho. Eu não tenho como responder isso por você, e é consulta ao CREFITO, não pesquisa. Enquanto essa resposta não existir, este material fica com o recorte mais duro: demonstração educativa, não prescrição.<\/p><h4>O que este checkpoint mede<\/h4><p>Os 40 testes musculares e a associação com meridianos, mais a digitopressão sistêmica, por meridiano e a reflexologia.<\/p><h4>Como fazer o teste<\/h4><p>A lógica tem três níveis:<\/p><ol><li>Tonificar o meridiano com digitopressão nos pontos de tonificação.<\/li><li>Sedar o meridiano acoplado, se houver excesso no Yang correspondente.<\/li><li>Tratar o órgão pelo estilo de vida: horário de comer, mastigar bem, dormir, temperatura dos alimentos.<\/li><\/ol><p>A pressão é firme e não dolorosa. Trinta a sessenta segundos por ponto, com pressão de 5 segundos e alívio de 2.<\/p><h4>O que conta como passou<\/h4><ul><li>Você localiza o ponto no lugar descrito<\/li><li>A pressão não provoca dor: se doer, reduza pela metade<\/li><li>A pele está limpa e seca antes<\/li><li>Não há vermelhidão intensa ao terminar<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Apertar forte para soltar mais. Pressão excessiva contrai o músculo em vez de relaxar.<\/li><li>Tratar todos os meridianos de uma vez. Faça o que corresponde aos músculos fracos encontrados.<\/li><li>Esperar que o ponto resolva o problema. O ponto ajuda; o exercício constrói.<\/li><li>Usar ponto no lugar de avaliação médica. Não substitui, em nenhuma situação.<\/li><\/ul><h4>Se você reprovou<\/h4><p>Este checkpoint tem uma mecânica diferente dos outros, e vale entender por quê.<\/p><p>Os checkpoints 1 a 9 liberam o seguinte quando você passa no teste. Aqui, não existe teste para passar: o checkpoint 10 é de apoio, e o protocolo é o que corresponde aos músculos que apareceram fracos nos testes manuais.<\/p><p>Mas existe quiz, e ele libera o checkpoint 11 com 5 acertos em 7. A razão é simples: eu preciso saber que você entendeu o que este módulo é e o que ele não é. Se você sair daqui achando que um ponto no pé resolve a sua dor, o checkpoint 11 vai te encontrar com a expectativa errada.<\/p><p>Então a regra do checkpoint 10 é esta: não há o que reprovar no corpo, e há o que acertar no entendimento. O quiz mede a segunda coisa, não a primeira.<\/p><p>O nível 3 é o que mais muda o resultado no longo prazo, porque ele é rotina e não ponto. Comer em horário regular, mastigar bem, não comer sob estresse, dormir. Isso qualquer escola de fisioterapia também defende.<\/p><h4>Perguntas frequentes<\/h4><p>Isso funciona mesmo?<\/p><p>Como conforto e adesão, sim. Eu uso há dezenove anos e vejo resultado. O que eu não vou te dizer é que um ponto no pé cura a sua lombar.<\/p><h5>Preciso de agulha?<\/h5><p>Não. Todo o protocolo é de digitopressão, com o dedo.<\/p><h5>Quanto tempo por dia?<\/h5><p>De 5 a 10 minutos, nos pontos que correspondem ao seu caso.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 11: correlação dento-neural", "by": "Checkpoint 11 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>A parte mais controversa do programa, apresentada com honestidade: hipótese em investigação e triagem.<\/p><p>Este módulo é triagem educativa, e não avaliação odontológica.<\/p><p>O que eu faço aqui é observar sinais e te orientar a procurar quem pode resolver. Serve como sinal de atenção, e não substitui dentista nem especialista em ATM.<\/p><p>Se aparecer travamento, estalo com dor, ou mandíbula que trava ao acordar, procure um profissional antes de seguir com qualquer massagem.<\/p><h4>O que este checkpoint mede<\/h4><p>Se existe sinal de que a mordida e a musculatura da face podem estar participando da sua dor cervical. O que este checkpoint mede é sinal de atenção, e não ausência de disfunção.<\/p><h4>Como fazer o teste<\/h4><ol><li>Palpe o masseter, na frente do ouvido, e o temporal, na têmpora. Aperte leve e abra a boca.<\/li><li>Observe: você acorda com a mandíbula cansada? Range os dentes? Tem marca de dente na língua?<\/li><li>Abra e feche a boca devagar, no espelho, e veja se o movimento desvia para um lado.<\/li><\/ol><h4>O que conta como passou<\/h4><ul><li>Não há dor à palpação do masseter e do temporal<\/li><li>Não há travamento ao abrir e fechar a boca<\/li><li>Você não acorda com a mandíbula cansada<\/li><li>Não há marca de dente na língua<\/li><\/ul><p>O desvio da mandíbula não entra como critério de aprovação. Abertura de boca sem desvio não prova ausência de disfunção: existe bruxismo severo em quem abre a boca reta. O desvio é um dado a observar e a relatar ao dentista, e não um selo de \"passou\".<\/p><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Massagem Peri-oral e Mandibular<\/h4><p>O que fazer<\/p><p>Você realiza automassagem na região da mandíbula e face: Técnica 1: Massagem do Masseter: Com o polegar e indicador, massagear a massa do masseter (ângulo da mandíbula) em movimentos circulares, 1 minuto por lado Objetivo: Relaxar o masseter (tensionado em focos dentários e em bruxismo) Técnica 2: Massagem da ATM: Com o dedo indicador, massagear a articulação temporomandibular (anterior à orelha) em movimentos circulares, com a boca levemente aberta, 1 minuto por lado Objetivo: Relaxar a ATM e melhorar a mobilidade mandibular Técnica 3: Massagem do Temporal: Com as pontas dos dedos, massagear a região temporal (lateral da testa, acima das orelhas) em movimentos circulares, 1 minuto Objetivo: Relaxar o músculo temporal (tensionado em bruxismo)<\/p><h6>O que conferir<\/h6><ul><li>Os movimentos são circulares, lentos e com pressão leve<\/li><li>Cada região recebe 1 minuto por lado<\/li><li>Não há pressão forte sobre a frente da orelha, onde passa a artéria<\/li><li>Não aparece dor durante a massagem<\/li><li>A mandíbula permanece leve e sem travamento ao terminar<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Apertar forte na frente da orelha. Ali passa a artéria temporal. Pressão leve, sempre.<\/li><li>Concluir que o dente causa a dor. O método mostra o que é observável e o que precisa de investigação.<\/li><li>Ignorar travamento com dor. Isso é sinal de procurar especialista.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é massagem peri-oral, alívio do masseter e pontos auriculares.<\/p><p>E a orientação mais importante: se você tem travamento, estalo com dor, ou acorda com a mandíbula travada, procure um dentista ou especialista em ATM. Resolver isso aqui seria mentira minha.<\/p><p>A correlação entre mordida e cadeia cervical é uma hipótese clínica em investigação. Eu não vou te dizer que o seu dente causa a sua dor de pescoço.<\/p><h4>Perguntas frequentes<\/h4><p>Meu dentista disse que não tem nada. E agora?<\/p><p>Ótimo: isso descarta a via dentária e o foco volta para o movimento. É informação útil, não beco sem saída.<\/p><h5>Uso aparelho. Isso muda algo?<\/h5><p>Pode mudar a mordida durante o tratamento. Avise seu dentista que você está fazendo o protocolo.<\/p><h5>Preciso ir ao dentista por causa do curso?<\/h5><p>Só se o teste indicar. Não é obrigatório para seguir o método.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 12: alongamentos Y e W", "by": "Checkpoint 12 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O checkpoint de fechamento. Ele integra o que você ganhou, e o quiz verifica se o ganho se mantém.<\/p><h4>O que este checkpoint mede<\/h4><p>Se o ombro e a coluna de cima conseguem manter o movimento que você recuperou nos outros checkpoints.<\/p><h4>Como fazer o teste<\/h4><p>Y: deitado de barriga para baixo, ou em pé inclinado, braços na diagonal formando um Y. Suba os braços sem encolher o ombro. Polegares para o teto.<\/p><p>W: braços dobrados formando um W, cotovelos a 90 graus e braços abduzidos a 90. Aperte as escápulas para baixo e para trás, sem levantar os ombros.<\/p><p>Devagar. Este exercício é de controle, e não de força.<\/p><p>Integração com respiração: sobe inspirando, desce soltando.<\/p><h4>O que conta como passou<\/h4><ul><li>Os polegares apontam para o teto<\/li><li>A cabeça permanece neutra, sem levantar<\/li><li>A elevação vem das escápulas, e não dos braços<\/li><li>A lombar não arqueia<\/li><li>Sem impulso em nenhuma repetição<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Y Stretching: Protocolo Completo<\/h4><p>O que fazer<\/p><p>Você em decúbito ventral, com os braços estendidos cranialmente em “Y” (120° de abdução), polegares apontando para o teto. Um foam roller pode ser colocado sob o abdome (na altura do umbigo) para apoio e mobilização adicional. Fase 1: Elevação Ativa: Elevar os braços e o tronco do solo simultaneamente, retraindo e deprimindo as escápulas Sustentar 3-5 segundos no topo Retornar controladamente Fase 2: Sustentação Isométrica: Elevar e sustentar 15-30 segundos Focar na ativação do trapézio inferior e no alongamento do peitoral Fase 3: Alcance Dinâmico: Elevar e adicionar leve rotação do tronco (para um lado e para o outro)<\/p><p>Focar na mobilização torácica rotacional séries de 10 repetições (Fase 1), 3 séries de sustentação (Fase 2), 3 séries de 5 alcances por lado (Fase 3).<\/p><h6>O que conferir<\/h6><ul><li>Polegares permanecem para o teto durante todo o movimento (sem pronation: indica limitação de rotação externa)<\/li><li>Escápulas em retração + depression (não elevation: elevation indica compensação por trapézio superior)<\/li><li>Tronco eleva junto com os braços (core posterior ativo)<\/li><li>Sem dor no ombro<\/li><\/ul><h4>W Stretching: Protocolo Completo<\/h4><p>O que fazer<\/p><p>Você em decúbito ventral, com os braços em “W”: cotovelos flexionados a 90°, braços abduzidos a 90°, antebraços direcionados cranialmente. Polegares apontando para o teto. Fase 1: Elevação Ativa: Elevar os cotovelos e antebraços do solo, retraindo e deprimindo as escápulas Sustentar 3-5 segundos Retornar controladamente Fase 2: Sustentação Isométrica: Elevar e sustentar 15-30 segundos Focar na ativação do trapézio médio e romboides Fase 3: Alcance Dinâmico com Rotação: Elevar e adicionar rotação do tronco (como se fosse alcançar algo atrás) Focar na mobilização escapular e rotação torácica 3 séries de 10 repetições (Fase 1), 3 séries de sustentação (Fase 2), 3 séries de 5 por lado (Fase 3).<\/p><h6>O que conferir<\/h6><ul><li>Os cotovelos ficam flexionados a 90 graus e os braços abduzidos a 90<\/li><li>Os polegares apontam para o teto durante todo o movimento<\/li><li>A cabeça permanece neutra, sem levantar<\/li><li>A elevação vem das escápulas, e não dos braços<\/li><li>A lombar não arqueia para ajudar<\/li><\/ul><h4>Progressão Y/W com Resistência<\/h4><p>O que fazer<\/p><p>Realizar o Y e W stretching com pequenos pesos (pesos pequenos de 1 a 2 kg) ou bandas elásticas em cada mão. A resistência aumenta a ativação muscular.<\/p><h6>O que conferir<\/h6><ul><li>O peso usado fica entre 1 e 2 kg por mão<\/li><li>O movimento acontece sem impulso: o peso sobe pela contração<\/li><li>O trapézio superior não assume: os ombros não sobem em direção às orelhas<\/li><li>A cabeça permanece neutra<\/li><li>O critério do Y e do W sem peso continua válido com a carga<\/li><\/ul><p>Integração Y/W com Respiração O que fazer<\/p><p>Durante o Y e W stretching, sincronizar a respiração: Inhale na elevação (expansão torácica: facilita o alongamento do peitoral e a mobilização torácica) Exhale no retorno (ativação do transverso: integração core- cadeia posterior)<\/p><h6>O que conferir<\/h6><ul><li>A inspiração acontece na subida dos braços, pelo nariz<\/li><li>A expiração acontece no retorno, pela boca<\/li><li>A respiração não é presa em nenhum momento<\/li><li>O ritmo da respiração acompanha o ritmo do movimento, sem pressa<\/li><li>O abdome participa da expiração, sem apertar em excesso<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Levantar os ombros em vez de abaixar as escápulas. É o trapézio trabalhando no lugar da escápula.<\/li><li>Usar impulso. Se precisa de impulso, a amplitude está grande demais.<\/li><li>Prender a respiração. O corpo se protege e o ganho desaparece.<\/li><li>Levantar a cabeça. Tira o foco da escápula e sobrecarrega o pescoço.<\/li><\/ul><h4>Se você reprovou<\/h4><p>Faça o Y e o W sem carga primeiro, até manter o critério em todas as repetições. Só depois entre com 1 a 2 kg por mão, ou banda leve.<\/p><p>Sobre o quiz deste checkpoint: o 12 não mede uma parte nova do corpo, ele integra o que você conquistou. Mas ele tem critério de execução, e o quiz cobra esse critério. A diferença é que aqui você não está sendo avaliado por uma estrutura nova, e sim pela sua capacidade de manter o que já ganhou quando o corpo para de ser guiado.<\/p><p>Se você reprovar no critério do Y e do W, o protocolo é o mesmo: sem carga, até manter em todas as repetições.<\/p><p>Este é também o protocolo dos dias ruins: quando a dor está alta e não dá para fazer o resto, o Y e o W com respiração mantêm você em movimento.<\/p><h4>Perguntas frequentes<\/h4><p>Posso fazer em pé?<\/p><p>Sim. Inclinado à frente, com as mãos apoiadas, é a versão mais fácil.<\/p><h5>Preciso de peso?<\/h5><p>Só na progressão. O exercício base é com o peso do corpo.<\/p><h5>Quantas vezes por semana?<\/h5><p>De três a cinco, junto com o restante do protocolo.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 2: marcha", "by": "Checkpoint 2 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Você dá entre cinco e vinte mil passos por dia. Um erro pequeno em cada passo se acumula o dia inteiro.<\/p><h4>O que este checkpoint mede<\/h4><p>Contato do pé, nivelamento da pelve, altura do pé na fase de balanço, largura da base e simetria do passo.<\/p><h4>Como fazer o teste<\/h4><ol><li>Use um corredor de pelo menos 6 metros, ou faça idas e voltas.<\/li><li>Caminhe normal, do jeito que você caminha na rua.<\/li><li>Filme de lado, com o corpo inteiro. Se puder, filme também de frente.<\/li><\/ol><p>Não tente andar bem. Esse é o ponto mais importante do teste: se você corrigir a marcha, o teste perde o valor.<\/p><h4>O que conta como passou<\/h4><ul><li>Calcanhar toca primeiro, depois a planta, depois os dedos<\/li><li>A pelve fica nivelada, sem cair para o lado<\/li><li>O passo é do mesmo tamanho dos dois lados<\/li><li>O pé levanta o suficiente para não arrastar<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Reeducação da Marcha (Gait Retraining Drills)<\/h4><p>O que fazer<\/p><p>Você realiza os drills abaixo em sequência, em um corredor de pelo menos 10 metros, preferencialmente frente a um espelho ou com filmagem: Drill 1: Marcha com Consciência do Calcanhar: Caminhar em velocidade reduzida, focando no contato inicial do calcanhar (calcanhar → planta → ponta) Manter dorsiflexão do tornozelo durante a fase de balanço (pé não “cai”) 10 idas e vindas Drill 2: Marcha com Linha de Progressão: Caminhar sobre uma linha desenhada no chão (ou fita crepe), mantendo os pés alinhados na linha Focar na base de suporte estreita (5-10 cm) 10 idas e vindas Drill 3: Marcha com Step Length Simétrico: Caminhar contando os passos (“1, 2, 1, 2”), garantindo que cada passo tem o mesmo comprimento Focar na simetria bilateral 10 idas e vindas Drill 4: Marcha com Estabilidade Pélvica: Caminhar com as mãos na cintura, sentindo o movimento da pelve Focar em manter a pelve nivelada (sem drop lateral) 10 idas e vindas Drill 5: Marcha com Balanço de Braços: Caminhar com balanço alternado e simétrico dos braços (braço direito em sincronia com perna esquerda) Focar na rotação do tronco (rotação suave, não excessiva) 10 idas e voltas O que conferir<\/p><ul><li>Contato inicial do calcanhar em cada passo<\/li><li>Dorsiflexão ativa durante a fase de balanço (sem foot slap)<\/li><li>Base de suporte estreita (5-10 cm)<\/li><li>Step length simétrico<\/li><li>Pelve nivelada durante a fase de apoio unipodal<\/li><li>Balanço de braços alternado e simétrico<\/li><li>Tronco estável (sem lateral sway excessivo)<\/li><\/ul><h4>Dorsiflexão Ativa Resistida (para Foot Drop)<\/h4><p>O que fazer<\/p><p>Você sentado, com a perna estendida. Uma faixa elástica (faixa elástica) é amarrada em torno do pé e fixada em um ponto estável (móvel ou porta) à frente do pé. Você realiza dorsiflexão do pé (puxa o pé para cima) contra a resistência da faixa. 3 séries de 15 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O pé retorna à posição neutra de forma controlada, sem deixar cair de uma vez<\/li><li>O joelho permanece estendido durante todo o movimento<\/li><li>Não aparece movimento de supinação do pé ao puxar<\/li><li>O calcanhar não sai do apoio<\/li><li>O movimento acontece só no tornozelo, sem girar a perna<\/li><\/ul><h4>Marcha na Ponta dos Pés / Calcanhares<\/h4><p>O que fazer<\/p><p>Você caminha na ponta dos pés (plantiflexão ativa) por 10 metros, e então caminha nos calcanhares (dorsiflexão ativa) por 10 metros. Alternar 5 vezes cada.<\/p><h6>O que conferir<\/h6><ul><li>Na ponta dos pés, o calcanhar sobe e o corpo se desloca sem balançar o tronco<\/li><li>Nos calcanhares, o pé não toca a planta no chão em momento algum<\/li><li>O percurso de 10 metros é cumprido em cada uma das duas formas<\/li><li>As 5 alternâncias são feitas sem parar para descansar no meio<\/li><li>Não há perda de equilíbrio que obrigue a dar um passo de correção<\/li><\/ul><p>Monster Walk (Caminhada com Mini-Band) O que fazer<\/p><p>Você coloca uma faixa elástica curta (faixa elástica circular) ao redor dos tornozelos (ou joelhos). Realiza passos laterais (abdução do quadril contra resistência) em posição de semi-agachamento, 10 passos para cada lado, 3 séries.<\/p><h6>O que conferir<\/h6><ul><li>O semi-agachamento se mantém durante todo o deslocamento, sem levantar o tronco<\/li><li>Os joelhos apontam para fora, sem cair para dentro em nenhum passo<\/li><li>Os pés não se arrastam: cada passo é elevado e recolocado<\/li><li>A banda permanece esticada do primeiro ao último passo<\/li><li>Os 10 passos para cada lado são feitos sem que o tronco balance lateralmente<\/li><\/ul><p>Erros comuns<\/p><ul><li>Pisar com a planta do pé. O pé entra chapado e o impacto sobe sem amortecimento.<\/li><li>A pelve cair para o lado quando apoia. É o glúteo médio que não está segurando o peso.<\/li><li>Arrastar o pé. Falta de dorsiflexão ativa na fase de balanço.<\/li><li>Passo de tamanho diferente entre os lados. Um lado trabalha mais e sobrecarrega.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo tem cinco exercícios de reeducação, um para cada erro identificado, e a caminhada progressiva começa aqui.<\/p><p>Caminhada progressiva:<\/p><table><tr><th>Semanas<\/th><th>Volume<\/th><th>Como<\/th><\/tr><tr><td>1e2<\/td><td>15 minutos<\/td><td>Terreno plano, ritmo de conversa, 3 a 5 vezes na semana<\/td><\/tr><tr><td>3e4<\/td><td>20 a 25 minutos<\/td><td>Com uma subida leve de 1 a 2 minutos<\/td><\/tr><tr><td>5e6<\/td><td>30 minutos<\/td><td>Com 3 trechos de 1 minuto mais acelerado<\/td><\/tr><\/table><p>Ritmo de conversa significa que você consegue falar sem ofegar.<\/p><h4>Perguntas frequentes<\/h4><p>Preciso marcar 10 metros no chão?<\/p><p>Ajuda, mas não é obrigatório. O que importa é filmar o corpo inteiro de lado.<\/p><h5>Posso fazer na esteira?<\/h5><p>Para o teste, não: a esteira muda o padrão. Para a caminhada progressiva, sim.<\/p><h5>Meu pé não levanta nada. É grave?<\/h5><p>É um achado importante, e o protocolo tem exercício específico para isso. Se piorar ou vier com dormência, fale comigo.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 3: agachamento livre e overhead", "by": "Checkpoint 3 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O movimento que a maioria das pessoas com dor lombar parou de fazer. E parar de agachar é o que piora o agachamento.<\/p><h4>O que este checkpoint mede<\/h4><p>Onde você para no agachamento, e o que compensa para chegar lá. Também os braços acima da cabeça.<\/p><h4>Como fazer o teste<\/h4><ol><li>Pés na largura do quadril, dedos levemente para fora.<\/li><li>Desça como se fosse sentar numa cadeira atrás de você.<\/li><li>Desça até onde der, sem tirar o calcanhar do chão.<\/li><li>Repita com os braços para cima: agachamento overhead.<\/li><li>Filme de frente e de lado. Nas duas.<\/li><\/ol><p>Aqui eu não quero saber se você agacha bem. Quero saber onde você para.<\/p><h4>O que conta como passou<\/h4><ul><li>Calcanhar no chão<\/li><li>Joelho sobre o segundo dedo do pé<\/li><li>Lombar mantendo a curva<\/li><li>Braço subindo até perto da orelha<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Self-Mobilization Talocrural (Mulligan Concept)<\/h4><p>O que fazer<\/p><p>Você em posição de afundo (lunge), com o pé a ser mobilizado à frente, apoiado contra uma parede. O joelho da frente é direcionado para frente (sobre o segundo dedo), mantendo o calcanhar no solo. Você usa uma faixa elástica amarrada em torno do tornozelo (na altura dos maléolos), fixada a um ponto posterior (porta). A faixa cria uma força de deslizamento posterior da tíbia sobre o tálus. Você move o joelho para frente e para trás, mantendo o calcanhar no solo. 3 séries de 10 repetições.<\/p><h6>O que conferir<\/h6><ul><li>O calcanhar da perna da frente permanece no chão durante todo o movimento<\/li><li>O joelho da frente vai em direção ao segundo dedo do pé, sem desviar para dentro<\/li><li>A faixa está na altura dos maléolos, nunca no pé<\/li><li>O movimento é de vai e vem, sem puxar o joelho e segurar<\/li><li>Não aparece dor na frente do tornozelo em intensidade acima de 3 de 10<\/li><\/ul><p>Alongamento de Gastrocnêmio e Sóleo O que fazer<\/p><p>Gastrocnêmio: Você em pé, frente a uma parede, com as mãos apoiadas na parede. O pé a ser alongado está atrás, com a perna estendida e o calcanhar no solo. O pé da frente está flexionado. Você inclina-se para frente, mantendo o calcanhar de trás no solo, até sentir alongamento na panturrilha. Sustentar 30 segundos, 3 séries. Sóleo: Mesma posição, mas com o joelho de trás levemente flexionado (que “desliga” o gastrocnêmio, que é biarticular). Sustentar 30 segundos, 3 séries.<\/p><h6>O que conferir<\/h6><ul><li>O calcanhar da perna de trás permanece no chão, sem levantar<\/li><li>Na versão do gastrocnêmio o joelho de trás está estendido; na do sóleo, flexionado<\/li><li>O alongamento é sentido na panturrilha, e não atrás do tornozelo<\/li><li>A sustentação de 30 segundos é cumprida em cada série<\/li><li>O tronco não desaba: o movimento vem do quadril indo à frente<\/li><\/ul><p>Self-Mobilization Hip Flexor (Mulligan / foam roller) O que fazer<\/p><p>Você em decúbito ventral, com um foam roller sob a coxa, na altura do terço proximal (próximo à origem do iliopsoas no fêmur). Você relaxa e deixa a gravidade alongar o iliopsoas. Para intensificar, você pode elevar o tronco com os braços (extensão do quadril). Sustentar 60-90 segundos, 3 séries.<\/p><h6>O que conferir<\/h6><ul><li>O foam roller fica no terço proximal da coxa, perto da dobra do quadril<\/li><li>A lombar permanece relaxada, sem arquear para aumentar o alongamento<\/li><li>O quadril da perna apoiada permanece em contato com a superfície<\/li><li>Não aparece dor lombar durante ou depois<\/li><li>Se houver formigamento na perna, a posição está comprimindo nervo e deve ser ajustada<\/li><\/ul><p>Goblet Squat (Agachamento com Peso na Frente) O que fazer<\/p><p>Você segura um peso (peso pequeno, como uma garrafa com água) com ambas as mãos contra o peito. Realiza um agachamento profundo, mantendo o tronco o mais ereto possível. O peso à frente cria um counterbalance que facilita a postura ereta e a profundidade. 3 séries de 10 repetições.<\/p><h6>O que conferir<\/h6><ul><li>O tronco permanece ereto, sem inclinar à frente durante a descida<\/li><li>O calcanhar não sai do chão em nenhuma fase<\/li><li>A descida chega até a coxa ficar paralela ao chão, ou até onde o critério se mantiver<\/li><li>O joelho acompanha a direção do segundo dedo do pé<\/li><li>O peso fica junto ao peito, sem se afastar do corpo<\/li><\/ul><h4>Wall Squat com Elevação de Calcanhares<\/h4><p>O que fazer<\/p><p>Você de costas para uma parede, com uma pequena elevação sob os calcanhares (placa de peso ou calcanheira de 2-3 cm). Realiza um agachamento deslizando as costas na parede, até a profundidade máxima. Sustenta 10 segundos no fundo. 3 séries de 5 repetições.<\/p><h6>O que conferir<\/h6><ul><li>As costas permanecem em contato com a parede do início ao fim<\/li><li>Os calcanhares ficam elevados 2 a 3 cm, no apoio previsto<\/li><li>A sustentação de 10 segundos no ponto mais baixo é cumprida<\/li><li>O joelho não passa à frente dos dedos do pé<\/li><li>Não há dor no joelho acima de 3 de 10<\/li><\/ul><h4>Aplicação: Suporte de Joelho (Patelar)<\/h4><p>O que fazer<\/p><p>Tira em “Y”, com a base na tuberosidade tibial e os ramos contornando a patela bilateralmente. Tensão 15-25%.<\/p><h6>O que conferir<\/h6><ul><li>A base da tira está na tuberosidade tibial, logo abaixo da patela<\/li><li>Os dois ramos contornam a patela sem encostar nela<\/li><li>A tensão fica entre 15 e 25 por cento: a fita acompanha a pele, sem enrugar<\/li><li>A pele estava limpa e seca antes da aplicação<\/li><li>O joelho foi posicionado em flexão de 30 graus durante a colagem<\/li><\/ul><p>Erros comuns<\/p><ul><li>Calcanhar sai do chão. Limitação de dorsiflexão do tornozelo.<\/li><li>Joelho entra para dentro. Falta de controle do glúteo médio.<\/li><li>Lombar arredonda no fim do movimento (butt wink). O quadril embola e a carga migra para a lombar.<\/li><\/ul><ul><li>Os braços não sobem. Quase sempre é a coluna de cima travada, e não o ombro.<\/li><\/ul><h4>Se você reprovou<\/h4><p>Antes de qualquer exercício, faça a hierarquia de medo.<\/p><p>Hierarquia de medo:<\/p><p>Liste três movimentos que você evita, do que dá menos medo para o que dá mais. Dê uma nota de 0 a 10 para cada.<\/p><p>Pode ser abaixar para pegar algo no chão, agachar no banheiro, carregar peso, subir no ônibus.<\/p><p>Comece pelo primeiro, na versão mínima. Pode ser só agachar até a metade, apoiado na porta. Repita por três sessões. Quando o medo cair para 2 ou menos, comece o segundo.<\/p><p>Se o medo subir em vez de cair por duas semanas, isso é informação clínica e não fracasso: me manda uma mensagem.<\/p><h4>Perguntas frequentes<\/h4><p>Não tenho peso em casa. Preciso comprar?<\/p><p>Não. O protocolo tem versão com peso corporal e versão na parede.<\/p><h5>Agachar com dor é perigoso?<\/h5><p>Com dor até 3 de 10 e sem piorar no dia seguinte, não. Com dor acima disso, recue a amplitude.<\/p><h5>Meu joelho estala. Devo parar?<\/h5><p>Estalo sem dor não é motivo para parar. Estalo com dor é.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 4: mobilidade articular", "by": "Checkpoint 4 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Quatro testes que apontam para correntes diferentes do corpo. O resultado de cada um manda você para um protocolo diferente.<\/p><h4>O que este checkpoint mede<\/h4><p>Thomas (flexor do quadril), Ober (lateral do quadril), Wall Angel (coluna de cima e ombro) e Shoulder Mobility (rotação do ombro).<\/p><h4>Como fazer o teste<\/h4><p>Thomas: deite de costas na beira de uma superfície firme. Traga um joelho ao peito e segure. Olhe a outra perna. Se a coxa da perna solta não descer até a mesa, o flexor está curto.<\/p><p>Ober: deite de lado. Deixe a perna de baixo esticada e traga a de cima para trás, com o joelho dobrado, segurando o pé. Olhe se o joelho de cima desce até a altura do quadril.<\/p><p>Wall Angel: de costas na parede, como no checkpoint 1. Braços em L, encostados. Suba e desça devagar.<\/p><p>Shoulder Mobility: uma mão por cima do ombro, outra por baixo, tentando alcançar os dedos nas costas. Meça a distância entre as mãos.<\/p><h4>O que conta como passou<\/h4><ul><li>Thomas: a coxa desce até a superfície e o joelho estica<\/li><li>Ober: o joelho de cima desce até a altura do quadril<\/li><li>Wall Angel: a lombar e os braços não descolam da parede<\/li><li>Shoulder Mobility: distância entre as mãos menor que uma mão (essa é a marca de passou)<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Kneeling Hip Flexor Stretch<\/h4><p>O que fazer<\/p><p>Você em posição de afundo no chão, com o joelho de trás apoiado no solo (em uma almofada) e o pé da frente à frente. O tronco é mantido ereto (não inclinado para frente). Você contrai o glúteo do lado de trás (extensão ativa do quadril) e desloca a pelve levemente para frente, mantendo a coluna ereta. Sustentar 30-45 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O tronco permanece ereto (não forward lean: que diminui o alongamento do psoas)<\/li><li>O glúteo do lado de trás é contraído ativamente (extensão ativa do quadril)<\/li><li>A pelve permanece neutra (não anterior tilt compensatório)<\/li><li>Sensação de alongamento na parte anterior da coxa/quadril (não dor na lombar)<\/li><li>O joelho de trás permanece no solo<\/li><\/ul><h4>Couch Stretch<\/h4><p>O que fazer<\/p><p>Você se posiciona de frente para um sofá ou parede, em posição de afundo. O joelho de trás é flexionado a 90° e o peito do pé (face dorsal) é apoiado contra a parede ou sofá. O tronco é mantido ereto. Sustentar 30-45 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O joelho da perna de trás está flexionado a 90 graus, apoiado na parede ou sofá<\/li><li>O peito do pé apoia na superfície, e não a ponta dos dedos<\/li><li>O tronco permanece ereto, sem inclinar à frente<\/li><li>A lombar não arqueia para compensar a falta de amplitude<\/li><li>A sustentação de 30 a 45 segundos é cumprida de cada lado<\/li><\/ul><h4>IT Band / TFL Stretch (Standing)<\/h4><p>O que fazer<\/p><p>Você em pé, com a perna a ser alongada cruzada atrás da outra (perna direita atrás da esquerda). Você inclina o tronco para o lado da perna de apoio (inclinar para a esquerda se a perna direita está atrás), mantendo a pelve nivelada. Sustentar 30-45 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A perna a ser alongada está cruzada atrás da perna de apoio<\/li><li>O quadril do lado alongado desce em direção ao chão, buscando a lateral<\/li><li>A pelve permanece nivelada, sem girar o tronco<\/li><li>O peso do corpo está na perna da frente, e não nos dedos<\/li><li>O alongamento é sentido na lateral do quadril, e não na lombar<\/li><\/ul><p>Foam Roller IT Band O que fazer<\/p><p>Você em decúbito lateral, com o foam roller sob a face lateral da coxa (na altura do TFL e trato iliotibial). O peso do corpo cria a pressão. Você rola o foam roller da crista ilíaca até o joelho, lentamente. 2-3 minutos por lado.<\/p><h6>O que conferir<\/h6><ul><li>O foam roller percorre da crista ilíaca até acima do joelho, sem passar na articulação<\/li><li>O peso do corpo é controlado pelos braços, sem desabar sobre o rolo<\/li><li>A velocidade é lenta, sem rolar rapidamente de uma vez<\/li><li>A dor sentida fica em nível tolerável, sem pontada aguda<\/li><li>Os 2 a 3 minutos são cumpridos sem prender a respiração<\/li><\/ul><h4>Foam Roller Thoracic Extension<\/h4><p>O que fazer<\/p><p>Você em decúbito dorsal, com o foam roller sob a coluna torácica (na altura de T2-T4 inicialmente). Os braços são estendidos em “Y” acima da cabeça. Você relaxa e deixa a gravidade alongar a coluna torácica em extensão sobre o foam roller. Sustentar 60-90 segundos. Mover o foam roller para T4-T6 e repetir. 3 posições, 2 séries cada.<\/p><h6>O que conferir<\/h6><ul><li>O foam roller está apoiado na coluna torácica, na altura inicial de T2 a T4<\/li><li>Os braços vão em Y acima da cabeça, com a palma para cima<\/li><li>A lombar permanece no chão, e não arqueada sobre o rolo<\/li><li>O quadril não sobe: o apoio é no chão e no rolo<\/li><li>Não aparece dor aguda na coluna durante a extensão<\/li><\/ul><h4>Cat-Cow (Mobilização Torácica Ativa)<\/h4><p>O que fazer<\/p><p>Você em posição de quatro apoios. Na fase “cow” (inhale): arquear a coluna em extensão, elevando a cabeça e o peito, abaixando o abdome. Na fase “cat” (exhale): arredondar a coluna em flexão, abaixando a cabeça, puxando o umbigo para dentro. Focar no movimento da coluna torácica (não apenas lombar). 10 ciclos, 2 séries.<\/p><h6>O que conferir<\/h6><ul><li>O movimento percorre a coluna de baixo para cima, e não tudo de uma vez<\/li><li>Na fase de arquear, o peito abre e a barriga desce<\/li><li>Na fase de arredondar, o queixo vai ao peito e o umbigo sobe<\/li><li>A respiração acompanha: inspira ao arquear, solta ao arredondar<\/li><li>Não aparece dor em nenhum ponto da coluna<\/li><\/ul><h4>Doorway Pec Stretch<\/h4><p>O que fazer<\/p><p>Você em pé, frente a um portal (moldura de porta). Coloca os antebraços nas molduras a 90° de abdução e 90° de flexão de cotovelo (posição de “rendição”). Você avança um passo à frente, sentindo alongamento no peitoral. Sustentar 30-45 segundos, 3 séries.<\/p><h6>O que conferir<\/h6><ul><li>Os antebraços ficam nas molduras a 90 graus de abdução e 90 de flexão do cotovelo<\/li><li>O avanço do corpo é dado com um passo à frente, com o tronco ereto<\/li><li>A lombar não arqueia para aumentar o alongamento<\/li><li>O alongamento é sentido no peito, e não na frente do ombro<\/li><li>Não aparece formigamento no braço<\/li><\/ul><h4>Towel Stretch (Alongamento com Toalha)<\/h4><p>O que fazer<\/p><p>Você segura uma toalha com ambas as mãos, uma mão por cima da cabeça e a outra por baixo das costas. Você puxa a toalha com a mão de cima, alongando o ombro de baixo (rotação interna). Sustentar 30 segundos. Inverter as mãos e alongar o outro ombro. 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A mão de cima puxa a toalha para cima, e a de baixo permanece relaxada<\/li><li>O ombro de baixo faz rotação interna, sem elevar<\/li><li>O tronco permanece imóvel durante a sustentação<\/li><li>Os 30 segundos são cumpridos de cada lado<\/li><li>Não aparece dor aguda no ombro<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Levantar a lombar no Thomas. Cria a ilusão de amplitude e o teste perde o valor.<\/li><li>Arquear a lombar no Wall Angel. Você compensa pela lombar o que falta na coluna de cima.<\/li><li>Inclinar a cabeça no Shoulder Mobility. Ganha centímetros que não existem.<\/li><li>Fazer os quatro protocolos. Cansa e faz desistir. Faça só o que reprovou.<\/li><\/ul><h4>Se você reprovou<\/h4><p>Faça só o protocolo do teste que reprovou:<\/p><table><tr><th>Teste reprovado<\/th><th>Protocolo<\/th><\/tr><tr><td>Thomas<\/td><td>Alongamento de flexor do quadril, couch stretch<\/td><\/tr><tr><td>Ober<\/td><td>Liberação de TFL, IT band e lateral da coxa<\/td><\/tr><tr><td>Wall Angel<\/td><td>Mobilidade torácica no rolo, cat-cow, peitoral na porta<\/td><\/tr><tr><td>Shoulder Mobility<\/td><td>Sleeper stretch, cross-body, toalha<\/td><\/tr><\/table><p>Fazer os quatro é o caminho mais rápido para desistir na segunda semana.<\/p><h4>Perguntas frequentes<\/h4><p>Preciso de foam roller?<\/p><p>Ajuda em dois dos protocolos. Sem ele, dá para fazer com toalha enrolada firme ou bola.<\/p><h5>Quanto tempo até o teste mudar?<\/h5><p>De duas a seis semanas, dependendo de quantos dias por semana você fizer.<\/p><h5>Reprovei nos quatro. Estou mal?<\/h5><p>Está com mobilidade limitada em várias regiões, o que é comum em quem passou anos se protegendo. Faça um protocolo por vez, na ordem dos checkpoints.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 5: mobilidade neural", "by": "Checkpoint 5 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Aqui a gente testa o nervo. Isso muda tudo, porque dor de nervo não se trata como dor de músculo.<\/p><h4>O que este checkpoint mede<\/h4><p>Se a sua dor tem componente neural: ASLR, SLR e Slump.<\/p><h4>Como fazer o teste<\/h4><p>ASLR: deite de costas, perna reta, sem dobrar o joelho. Levante a perna até onde der.<\/p><p>SLR: parecido, com o pé dobrado em direção à canela.<\/p><p>Slump: sentado na beira da cadeira, mãos atrás da cabeça, costas curvadas à frente, e estique um joelho.<\/p><p>Filme de lado, pegando o corpo inteiro.<\/p><h4>O que conta como passou<\/h4><ul><li>A perna sobe perto de 70 graus, sem dor e sem formigamento<\/li><li>No Slump, você sente alongamento atrás da coxa, e não choque<\/li><li>Nenhum teste provoca dormência<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem. sliders do Nervo Ciático (Neural Flossing) O que fazer<\/p><p>Você sentado, com a perna estendida sobre uma superfície (cadeira ou banco). Fase 1: estender a perna (dorsiflexão do tornozelo + extensão do joelho) enquanto inclina a cabeça para trás (extensão cervical): isto “desce” o nervo ciático pela perna. Fase 2: flexionar a perna (plantiflexão + flexão do joelho) enquanto flexiona a cabeça (queixo ao peito): isto “sobe” o nervo. O movimento deve ser suave e rítmico, sem dor. 10 ciclos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O movimento deve ser indolor: qualquer dor neurológica (choque, formigamento, irradiação) indica que a amplitude deve ser reduzida<\/li><li>O movimento deve ser suave e rítmico (sem trancos)<\/li><li>A perna e a cabeça movem em direções opostas (quando a perna estende, a cabeça estende; quando a perna flexiona, a cabeça flexiona)<\/li><li>Bilateral, comparando os lados<\/li><\/ul><h4>Slump Flossing (Mobilização do Neuroeixo)<\/h4><p>O que fazer<\/p><p>Você sentado na borda da cadeira firme, com as pernas pendentes. Fase 1: slump da coluna (flexão lombar/ torácica) + flexão cervical + extensão do joelho + dorsiflexão do tornozelo (posição de máxima tensão). Fase 2: estender a cervical (queixo para cima) mantendo o slump da coluna e a extensão do joelho (alivia a tensão central). Alternar fase 1 e 2 suavemente. 10 ciclos, 3 séries.<\/p><h6>O que conferir<\/h6><ul><li>O movimento tem duas fases alternadas: uma de tensão e uma de alívio<\/li><li>A fase de tensão é feita sem chegar à dor, só até o ponto de tensão<\/li><li>A fase de alívio desfaz a tensão antes de repetir<\/li><li>O formigamento não aumenta durante o exercício: se aumentar, a amplitude está grande<\/li><li>O movimento é de deslizar, sem esticar e segurar<\/li><\/ul><h4>Isquiotibial em Decúbito (Supine Hamstring Stretch)<\/h4><p>O que fazer<\/p><p>Você em decúbito dorsal, com uma perna estendida no solo e a outra elevada (usando uma toalha ou faixa amarrada em torno do pé). O joelho da perna elevada permanece estendido. Você puxa a perna suavemente em direção à cabeça, alongando a parte posterior da coxa. Sustentar 30-45 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O joelho da perna elevada permanece estendido<\/li><li>A perna de apoio permanece estendida no chão<\/li><li>A lombar não descola do chão para ganhar amplitude<\/li><li>O alongamento para no ponto de tensão, sem chegar à dor<\/li><li>A perna não treme de forma descontrolada<\/li><\/ul><h4>Aplicação: Decompression Tape para Ciático<\/h4><p>O que fazer<\/p><p>Tira em “I” com tensão 0-10% (decompressão), aplicada ao longo do trajeto do nervo ciático: da região glútea (abaixo do piriforme) até a face posterior da coxa, continuando pela face posterior da perna até o tornozelo. Você deve estar em flexão anterior do quadril (para criar pré-tensionamento) durante a aplicação.<\/p><h6>O que conferir<\/h6><ul><li>A tensão fica entre 0 e 10 por cento: a fita é praticamente aplicada sem esticar<\/li><li>A tira segue o trajeto do nervo, da região glútea até o tornozelo<\/li><li>Não há enrugamento nem dobra na fita<\/li><li>A pele estava limpa e seca antes da aplicação<\/li><li>Não aparece formigamento novo depois da aplicação<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Dobrar o joelho no ASLR. Mascara o teste. A perna precisa estar estendida.<\/li><li>Forçar o pescoço no Slump. O movimento é curvar a coluna, não empurrar a cabeça.<\/li><li>Insistir quando aparece formigamento. Formigamento é sinal de parar, não de coragem.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é neural flossing: movimento de deslizar o nervo, e não de esticar. A diferença é enorme e está no vídeo.<\/p><p>Duas regras que não se negociam:<\/p><ol><li>O movimento é de vai e vem, sem chegar à tensão máxima, e sem segurar.<\/li><li>Se aparecer formigamento que desce, dormência ou dor em choque, pare na hora.<\/li><\/ol><p>Alongar isquiotibiais só entra depois do flossing, e nunca no meio de uma crise neural.<\/p><h4>Perguntas frequentes<\/h4><p>Sinto um choque que desce pela perna. Devo continuar?<\/p><p>Não. Pare e me mande mensagem. Esse é o sinal mais importante do curso.<\/p><h5>Nervo tem alongamento?<\/h5><p>Tem deslizamento. Esticar nervo piora; deslizar melhora.<\/p><h5>Posso fazer todos os dias?<\/h5><p>Sim, uma vez por dia, sem chegar à tensão máxima.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 6: core", "by": "Checkpoint 6 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>Aqui não se mede abdômen bonito. Mede-se se o tronco segura a coluna enquanto braço e perna trabalham.<\/p><h4>O que este checkpoint mede<\/h4><p>Ponte, rotary stability e trunk push-up. E a respiração, que abre e fecha cada sessão.<\/p><h4>Como fazer o teste<\/h4><p>Ponte: deite, joelhos dobrados, suba o quadril. Segure 10 segundos.<\/p><p>Rotary stability: de quatro, estique braço e perna opostos ao mesmo tempo, sem balançar o tronco.<\/p><p>Trunk push-up: de prancha, desça o tronco e volte, sem deixar a lombar cair.<\/p><p>Respiração: 4 segundos inspirando pelo nariz, 6 segundos soltando pela boca. 10 ciclos, no começo e no fim de cada sessão.<\/p><h4>O que conta como passou<\/h4><ul><li>Linha reta da cabeça ao calcanhar na prancha<\/li><li>A lombar não afunda nem sobe<\/li><li>A pelve não roda na rotary stability<\/li><li>A ponte sobe até alinhar joelho, quadril e ombro, e para ali<\/li><\/ul><p>Os exercícios deste módulo Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Dead Bug (Besouro Morto)<\/h4><p>O que fazer<\/p><p>Você em decúbito dorsal, com os braços estendidos para o teto e os joelhos flexionados a 90° (pernas elevadas). Você ativa o transverso (puxa o umbigo levemente para dentro, sem prender a respiração). Fase 1: estende um braço acima da cabeça e a perna oposta até quase tocar o solo, mantendo a coluna lombar em contato com o solo. Fase 2: retorna à posição inicial. Alterna lados. 3 séries de 10 repetições (5 por lado).<\/p><h6>O que conferir<\/h6><ul><li>A coluna lombar permanece em contato com o solo durante todo o movimento (sem arch)<\/li><li>O transverso permanece ativado (abdome não protuberante)<\/li><\/ul><ul><li>A respiração continua normal durante todo o movimento<\/li><li>O movimento é controlado (sem momentum)<\/li><li>Simetria bilateral<\/li><\/ul><h4>Bird Dog (Cão de Caça)<\/h4><p>O que fazer<\/p><p>Você em posição de quatro apoios, com mãos e joelhos no solo, braços e coxas perpendiculares ao solo. Você ativa o transverso. Fase 1: estende um braço para frente e a perna oposta para trás, mantendo o core estável (sem rotação do tronco, sem sagging lombar). Fase 2: retorna à posição inicial. Alterna lados. 3 séries de 10 repetições (5 por lado).<\/p><h6>O que conferir<\/h6><ul><li>A coluna permanece neutra (sem sagging lombar, sem arching)<\/li><li>O tronco mantém a pelve nivelada sem rotação do tronco<\/li><li>O braço e a perna estendem completamente<\/li><li>O movimento é controlado<\/li><li>Simetria bilateral<\/li><\/ul><h4>Plank Progressions (Progressões de Prancha)<\/h4><p>O que fazer<\/p><p>Prancha frontal (prone plank): Avaliado em posição de prancha (antebraços e ponta dos pés no solo), alinhamento reto. Sustentar 30-60 segundos, 3 séries. Prancha lateral (side plank): Avaliado em decúbito lateral, apoiado no antebraço, corpo elevado em alinhamento lateral. Sustentar 30-45 segundos, 3 séries, bilateral. Prancha frontal com toque de ombro (shoulder tap plank): Na posição de prancha alta (mãos no solo), você toca o ombro oposto com cada mão alternadamente, mantendo o core estável (sem rotação do tronco). 3 séries de 10 toques (5 por lado). Prancha frontal com elevação de braço e perna (plank with arm/leg lift): Na posição de prancha, você eleva um braço e a perna oposta, sustentando 3-5 segundos. Alterna lados. 3 séries de 10 (5 por lado).<\/p><h6>O que conferir<\/h6><ul><li>O corpo forma uma linha reta da cabeça ao calcanhar<\/li><li>A lombar não afunda nem sobe em nenhum momento da sustentação<\/li><li>O quadril não desce na prancha lateral<\/li><li>A sustentação de 30 a 60 segundos é cumprida sem parar<\/li><li>A respiração continua normal, sem prender<\/li><\/ul><h4>Glute Bridge (Ponte Glútea)<\/h4><p>O que fazer<\/p><p>Você em decúbito dorsal, com joelhos flexionados e pés apoiados no solo. Eleva a pelve contraindo o glúteo máximo (não os isquiotibiais), até alinhar joelho-quadril-ombro. Sustenta 3 segundos no topo. 3 séries de 15 repetições. Progressão: Ponte glútea unipodal (uma perna elevada), ponte glútea com faixa elástica curta ao redor dos joelhos, ponte glútea com elevação dos braços.<\/p><h6>O que conferir<\/h6><ul><li>O quadril sobe até alinhar joelho, quadril e ombro, sem passar disso<\/li><li>A subida vem do glúteo: se aparecer cãibra atrás da coxa, o isquiotibial assumiu<\/li><li>A lombar não arqueia no topo<\/li><li>A sustentação de 3 segundos no topo é cumprida<\/li><li>O quadril desce de forma controlada, sem cair<\/li><\/ul><h4>Clamshell (Concha)<\/h4><p>O que fazer<\/p><p>Você em decúbito lateral, com os joelhos flexionados a 90° e os pés juntos. Você abre o joelho superior (abdução do quadril com rotação externa) mantendo os pés juntos e a pelve estável (não rolling back). 3 séries de 15 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A pelve permanece imóvel: ela não rola para trás para abrir o joelho<\/li><li>Os pés permanecem juntos durante todo o movimento<\/li><li>A abertura chega ao limite antes de a pelve girar<\/li><li>O quadril não se estende junto com a abertura, só roda<\/li><li>O movimento é lento o suficiente para parar ao primeiro sinal de giro da pelve<\/li><\/ul><p>Aplicação: Facilitação Abdominal (Transverso) O que fazer<\/p><p>Tira em “I” horizontal, de uma EIAS à outra, sobre o baixo ventre, com tensão 25%. Aplicada com você em leve posterior pelvic tilt.<\/p><h6>O que conferir<\/h6><ul><li>A tira vai de uma espinha ilíaca ântero-superior à outra, na horizontal, sobre o baixo ventre<\/li><li>A tensão é 25 por cento<\/li><li>A aplicação é feita com a pelve em leve retroversão<\/li><li>A fita não enruga ao sentar e levantar<\/li><li>Não aparece irritação de pele em 24 horas<\/li><\/ul><h4>Aplicação: Facilitação Lombar (Eretor da Espinha)<\/h4><p>O que fazer<\/p><p>Duas tiras em “I” verticais, paralelas à coluna, sobre a musculatura paravertebral lombar (2 dedos laterais aos processos espinhosos), com tensão 25%. Aplicadas com você em leve flexão anterior.<\/p><h6>O que conferir<\/h6><ul><li>São duas tiras verticais, paralelas à coluna, a 2 dedos de cada lado dos processos espinhosos<\/li><li>A tensão é 25 por cento<\/li><li>A aplicação é feita com a coluna em leve flexão anterior<\/li><li>As tiras cobrem a lombar e não sobem para a torácica<\/li><\/ul><ul><li>A pele estava limpa e seca<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Subir demais a ponte e arquear a lombar. A carga sai do glúteo e vai para a lombar.<\/li><li>Cãibra atrás da coxa na ponte. O isquiotibial assumiu no lugar do glúteo.<\/li><li>Rodar a pelve na rotary stability. O movimento saiu do core e foi para a lombar.<\/li><li>Prender a respiração. Sobe a pressão abdominal e o corpo recruta proteção em vez de estabilidade.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é uma progressão em três níveis: dead bug, bird dog e prancha. Avance só quando o nível atual sair sem perder o critério.<\/p><p>Reduza o nível em vez de reduzir a qualidade. E não pule a respiração: dois minutos no começo e no fim mudam a dor percebida e criam o ritual que sustenta a rotina.<\/p><h4>Perguntas frequentes<\/h4><p>Preciso de colchonete?<\/p><p>Tapete ou toalha dobrada resolvem. Chão duro atrapalha a lombar.<\/p><h5>Quantos segundos de prancha?<\/h5><p>De 30 a 60, e pare quando a lombar afundar ou subir. Tempo maior com lombar torta não vale nada.<\/p><h5>A respiração é obrigatória?<\/h5><p>É o exercício mais barato do método. Dois minutos, e ajuda nos dias de dor alta.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 7: unipodal", "by": "Checkpoint 7 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O checkpoint em que a maioria descobre que tem um lado muito mais fraco que o outro, e que sempre foi assim.<\/p><h4>O que este checkpoint mede<\/h4><p>Single leg squat, step down e Y Balance. E o controle do glúteo médio em uma perna só.<\/p><h4>Como fazer o teste<\/h4><p>Single leg squat: em uma perna, desça devagar. Olhe o joelho.<\/p><p>Step down: em cima de um degrau baixo, desça uma perna controlando. Toque o chão leve e volte.<\/p><p>Y Balance: em uma perna, alcance o mais longe que conseguir em três direções: frente, trás por dentro, trás por fora. Marque o alcance com fita ou giz.<\/p><h4>O que conta como passou<\/h4><ul><li>Joelho sobre o segundo dedo, sem cair para dentro<\/li><li>Pelve nivelada<\/li><li>Diferença entre os lados menor que 10% no Y Balance<\/li><li>A perna de apoio não treme de forma descontrolada<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Clamshell with Band<\/h4><p>O que fazer<\/p><p>Mesma posição do clamshell, mas com faixa elástica curta ao redor dos joelhos. A resistência aumenta a demanda do glúteo médio. 3 séries de 15 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A pelve permanece estável, sem rolar para trás<\/li><li>A abertura acontece contra a banda, com os pés juntos<\/li><li>A banda permanece no lugar, sem deslizar para cima da coxa<\/li><li>As 15 repetições são feitas sem parar no meio<\/li><li>O joelho da perna de cima não passa da linha do quadril<\/li><\/ul><h4>Side Lying Leg Raise (Abdução em Decúbito Lateral)<\/h4><p>O que fazer<\/p><p>Você em decúbito lateral, com a perna inferior flexionada (estabilidade) e a perna superior estendida. Você eleva a perna superior (abdução do quadril) mantendo a rotação neutra (o pé não deve apontar para o teto = rotação externa; não deve apontar para o solo = rotação interna). 3 séries de 15 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O pé da perna elevada aponta para a frente, e não para o teto<\/li><li>A pelve permanece imóvel, sem rolar para trás<\/li><li>A perna inferior permanece flexionada como apoio<\/li><li>O quadril não gira para fora para ganhar altura<\/li><li>A perna sobe e desce sem impulso<\/li><\/ul><h4>Single Leg Deadlift (Stiff-Leg Deadlift Unipodal)<\/h4><p>O que fazer<\/p><p>Você em pé sobre uma perna, com a outra perna levemente elevada. Você inclina o tronco para frente (flexão do quadril) enquanto estende a perna livre para trás (extensão do quadril), mantendo a coluna neutra. O movimento é uma “charneira” do quadril (não flexão da coluna). Retorna à posição inicial. 3 séries de 10 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A coluna permanece neutra (sem flexão lombar: o movimento é do quadril)<\/li><li>A pelve permanece nivelada (sem drop lateral: Trendelenburg)<\/li><li>A perna livre estende-se para trás em alinhamento com o tronco<\/li><li>O joelho de apoio permanece levemente flexionado (não locked)<\/li><li>O movimento é controlado (sem momentum)<\/li><\/ul><h4>Step Up (Subida no Degrau)<\/h4><p>O que fazer<\/p><p>Você em pé, frente a um degrau de 20-30 cm. Coloca um pé no degrau e sobe (elevando o corpo) usando primariamente a perna do degrau (não empurrando com a perna do solo). Desce controladamente. 3 séries de 10 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A subida vem da perna que está no degrau, sem empurrar com a perna do chão<\/li><li>O tronco permanece ereto durante a subida<\/li><li>O joelho acompanha o segundo dedo do pé, sem cair para dentro<\/li><li>A descida é controlada até o chão, sem deixar o corpo cair<\/li><li>O degrau tem entre 20 e 30 cm de altura<\/li><\/ul><h4>Single Leg Glute Bridge<\/h4><p>O que fazer<\/p><p>Mesma posição da ponte glútea, mas com uma perna elevada (estendida). Você eleva a pelve usando apenas a perna de apoio. 3 séries de 10 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>A pelve permanece nivelada, sem girar para o lado da perna solta<\/li><li>A subida vem do glúteo da perna de apoio<\/li><\/ul><ul><li>A lombar não arqueia no topo<\/li><li>O quadril desce de forma controlada<\/li><li>As 10 repetições são feitas sem cãibra atrás da coxa<\/li><\/ul><h4>Quadruped Hip Extension (Donkey Kick)<\/h4><p>O que fazer<\/p><p>Você em quatro apoios. Eleva uma perna flexionada a 90° (joelho) para cima (extensão do quadril), contraindo o glúteo máximo. 3 séries de 15 repetições, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O quadril não roda: o tronco permanece paralelo ao chão<\/li><li>A lombar não arqueia para elevar mais a perna<\/li><li>O joelho permanece flexionado a 90 graus<\/li><li>O movimento vem do glúteo, e não do impulso da lombar<\/li><li>O quadril desce de forma controlada<\/li><\/ul><p>90/90 Hip Stretch O que fazer<\/p><p>Você sentado no solo, com uma perna flexionada a 90° à frente (joelho no solo, pé apontando para o lado) e a outra perna flexionada a 90° atrás (joelho no solo, pé apontando para o lado). Você inclina-se sobre a perna da frente (alongamento rotação interna do quadril posterior) e depois sobre a perna de trás (alongamento rotação externa do quadril anterior). Sustentar 30 segundos em cada posição, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>Os dois joelhos ficam no chão, um à frente e outro atrás<\/li><li>Ambos os pés apontam para o mesmo lado, como em 90 graus<\/li><li>O tronco inclina sobre a perna da frente mantendo a coluna ereta<\/li><li>Não aparece dor no joelho da frente<\/li><li>A sustentação é cumprida dos dois lados<\/li><\/ul><h4>Aplicação: Suporte Patelar (para Valgus Dinâmico)<\/h4><p>O que fazer<\/p><p>Tira em “Y” com a base na tuberosidade tibial e os ramos contornando a patela. Tensão 15-25%. Aplicada com o joelho em flexão de 30°.<\/p><h6>O que conferir<\/h6><ul><li>A base da tira está na tuberosidade tibial, como no suporte patelar<\/li><li>Os ramos contornam a patela sem encostar nela<\/li><li>A tensão fica entre 15 e 25 por cento<\/li><li>A aplicação é feita com o joelho em 30 graus de flexão<\/li><li>A fita acompanha a pele, sem enrugar<\/li><\/ul><h4>Aplicação: Facilitação do Glúteo Médio<\/h4><p>O que fazer<\/p><p>Tira em “Y” ou “fan” sobre o glúteo médio (face lateral do quadril), da origem (fossa ilíaca externa) à inserção (trocânter maior). Tensão 25-50% (facilitação). Aplicada com você em decúbito lateral e o quadril em leve abdução.<\/p><h6>O que conferir<\/h6><ul><li>A tira vai da fossa ilíaca externa ao trocanter maior<\/li><li>A tensão fica entre 25 e 50 por cento, que é a faixa de facilitação<\/li><li>A aplicação é feita em decúbito lateral, com o quadril em leve abdução<\/li><li>A fita cobre a massa muscular, sem invadir a dobra do quadril<\/li><li>Não aparece irritação de pele<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Joelho entra para dentro. O sinal mais importante deste checkpoint.<\/li><li>Tronco desaba para o lado no step down. O glúteo do lado de apoio não está estabilizando.<\/li><li>Pelve rola no clamshell. O exercício parece certo e não trabalha o glúteo médio.<\/li><li>Empurrar com a perna de baixo no step up. Tira todo o valor do exercício.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é glúteo médio, glúteo máximo e mobilidade de quadril, nesta ordem.<\/p><p>A hierarquia de medo volta aqui. Se um dos três movimentos que você anotou no checkpoint 3 envolve uma perna só, é neste checkpoint que ele entra na progressão. Se você não escreveu nada no checkpoint 3, escreva agora: é essa parte que faz o medo ceder.<\/p><h4>Perguntas frequentes<\/h4><p>Um lado é muito pior. É normal?<\/p><p>É comum, e é informação. Comece pelo lado fraco e faça uma repetição a mais nele.<\/p><h5>Preciso de banco para o step down?<\/h5><p>Um degrau de escada serve. Altura entre 15 e 20 cm.<\/p><h5>Y Balance precisa de régua?<\/h5><p>Fita no chão ou giz bastam. O que importa é comparar os dois lados.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 8: membro superior", "by": "Checkpoint 8 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O checkpoint de quem tem dor no ombro, no pescoço ou entre as escápulas. E o que mais gente pula por achar que não é o seu caso.<\/p><h4>O que este checkpoint mede<\/h4><p>Upper YBT e CKCUES. Se a escápula se move ou fica travada enquanto o ombro trabalha.<\/p><h4>Como fazer o teste<\/h4><p>Upper YBT: em pé, uma mão na cintura, a outra alcança o mais longe possível em três direções, sem tirar a mão de apoio.<\/p><p>CKCUES: o teste de flexão na parede. Mãos na parede na altura do ombro e desça o peito.<\/p><p>Filme de frente e, se possível, um detalhe da escápula.<\/p><h4>O que conta como passou<\/h4><ul><li>Mesma distância nos dois lados<\/li><li>A escápula desliza durante o movimento<\/li><li>Sem dor<\/li><li>Os ombros não sobem em direção às orelhas<\/li><\/ul><h4>Os exercícios deste módulo<\/h4><p>Cada exercício tem o que fazer e o que conferir. Execute na ordem em que aparecem.<\/p><h4>Serratus Punch (Protração Escapular)<\/h4><p>O que fazer<\/p><p>Você em decúbito dorsal, com um peso (peso pequeno) em cada mão, braços estendidos para o teto. Você “empurra” os pesos para o teto (protração escapular), elevando as escápulas do solo, e retorna. 3 séries de 15 repetições.<\/p><h6>O que conferir<\/h6><ul><li>As escápulas se elevam do chão no final do empurrão<\/li><li>Os cotovelos permanecem estendidos durante o movimento<\/li><li>A lombar não arqueia para ajudar<\/li><li>O movimento é só de ombro e escápula, sem dobrar o cotovelo<\/li><li>Os 15 empurrões são feitos de forma controlada<\/li><\/ul><h4>Prone Y, T, W, I (Back Extensions com Braços)<\/h4><p>O que fazer<\/p><p>Você em decúbito ventral, com a testa apoiada em uma toalha (cervical neutra). Realiza os quatro padrões: Y: Braços estendidos em “Y” (120° de abdução), polegares para o teto. Eleva os braços do solo, retraindo e deprimindo as escápulas. 10 repetições. T: Braços estendidos em “T” (90° de abdução), polegares para o teto. Eleva os braços do solo. 10 repetições. W: Cotovelos flexionados a 90°, braços em “W”. Eleva os cotovelos do solo. 10 repetições. I: Braços estendidos ao lado do corpo (paralelos ao tronco), polegares para o teto. Eleva os braços do solo. 10 repetições. séries de cada padrão.<\/p><h6>O que conferir<\/h6><ul><li>A testa permanece apoiada durante todo o exercício<\/li><li>Os polegares apontam para o teto em todas as posições<\/li><li>A cabeça não levanta para ganhar amplitude<\/li><li>Os braços saem do chão apenas até onde a escápula consegue<\/li><li>Cada letra é feita com o mesmo número de repetições<\/li><\/ul><h4>Wall Slides (Deslizamento na Parede)<\/h4><p>O que fazer<\/p><p>Você de frente para uma parede, com os antebraços e dorsos das mãos na parede (posição de “rendimento”: 90° de abdução, 90° de flexão de cotovelo). Você desliza os braços para cima (abdução + rotação externa) mantendo o contato com a parede, e retorna. 3 séries de 10 repetições.<\/p><h6>O que conferir<\/h6><ul><li>Os antebraços e o dorso das mãos ficam na parede durante o movimento<\/li><li>A lombar não arqueia para permitir a subida<\/li><li>Os ombros não sobem em direção às orelhas<\/li><li>A subida vai até onde a lombar e o ombro mantiverem o critério<\/li><li>O movimento é lento, sem impulso<\/li><\/ul><h4>Push-up Plus<\/h4><p>O que fazer<\/p><p>Você em posição de prancha alta (mãos no solo). Realiza um push-up completo e, no topo (cotovelos estendidos), empurra o tronco para o teto (protração escapular máxima: o “plus”). 3 séries de 10 repetições.<\/p><h6>O que conferir<\/h6><ul><li>No topo do movimento, as escápulas se afastam e o tronco sobe alguns centímetros<\/li><\/ul><ul><li>Os cotovelos ficam estendidos no momento do plus<\/li><li>O corpo permanece reto, sem afundar a lombar<\/li><li>A descida vai até o peito perto do chão e o retorno é controlado<\/li><li>As 10 repetições são feitas com o plus em todas<\/li><\/ul><h4>Sleeper Stretch (Alongamento do Posterior Capsule)<\/h4><p>O que fazer<\/p><p>Você em decúbito lateral, com o lado a ser alongado para baixo. O braço está flexionado a 90° (cotovelo na altura do ombro) e o cotovelo flexionado a 90°. Você usa a outra mão para empurrar o antebraço para baixo (rotação interna do ombro). Sustentar 30-60 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O cotovelo fica na altura do ombro e flexionado a 90 graus<\/li><li>A mão de cima empurra o antebraço para baixo, sem forçar<\/li><li>O tronco não rola para trás para aumentar o alongamento<\/li><li>O alongamento é sentido atrás do ombro, e não na frente<\/li><li>Não aparece dor ou formigamento no braço<\/li><\/ul><h4>Cross-Body Stretch<\/h4><p>O que fazer<\/p><p>Você em pé, traz o braço cruzado à frente do corpo (adução horizontal), usando a outra mão para puxar o braço em direção ao peito. Sustentar 30 segundos, 3 séries, bilateral.<\/p><h6>O que conferir<\/h6><ul><li>O braço cruza a frente do peito na altura do ombro<\/li><li>O ombro do braço alongado não sobe em direção à orelha<\/li><li>O tronco permanece imóvel, sem girar<\/li><li>Os 30 segundos são cumpridos de cada lado<\/li><li>Não há formigamento no braço<\/li><\/ul><h4>Aplicação: Facilitação do Serrátil Anterior<\/h4><p>O que fazer<\/p><p>Tira em “Y” com a base na borda medial inferior da escápula e os ramos seguindo a direção das fibras do serrátil (ao redor das costelas). Tensão 25-50% (facilitação). Aplicada com você em rotação escapular completa (mão na nuca).<\/p><h6>O que conferir<\/h6><ul><li>A base da tira está na borda medial inferior da escápula<\/li><li>Os ramos seguem a direção das fibras do serrátil, contornando as costelas<\/li><li>A tensão fica entre 25 e 50 por cento, faixa de facilitação<\/li><li>A aplicação é feita com o braço elevado, na rotação escapular completa<\/li><li>A fita não enruga quando o braço desce<\/li><\/ul><h4>Aplicação: Inibição do Trapézio Superior<\/h4><p>O que fazer<\/p><p>Tira em “Y” com a base na clavícula e os ramos seguindo a direção das fibras do trapézio superior (até a linha nucal). Tensão 15-25% (inibição). Aplicada com o ombro em retração e depression.<\/p><h6>O que conferir<\/h6><ul><li>A base da tira está na clavícula<\/li><li>Os ramos seguem até a linha nucal, acompanhando o trapézio superior<\/li><li>A tensão fica entre 15 e 25 por cento, faixa de inibição<\/li><li>A aplicação é feita com o ombro em retração e depressão<\/li><li>Não há compressão sobre a frente do pescoço<\/li><\/ul><h4>Erros comuns<\/h4><ul><li>Rodar o tronco no Upper YBT. Ganha alcance que não existe.<\/li><li>Ombro subindo no CKCUES. Quem está trabalhando é o trapézio superior.<\/li><li>Prender a respiração. Aumenta a tensão no pescoço.<\/li><li>Levantar a cabeça no prone Y/T/W/I. Tira o foco da escápula.<\/li><\/ul><h4>Se você reprovou<\/h4><p>O protocolo é fortalecimento escapular e mobilidade de ombro.<\/p><p>E o ponto que quase ninguém entende: o ombro melhora quando a coluna de cima destrava. O protocolo deste checkpoint puxa o protocolo do checkpoint 1 e do 4. A razão é simples: é o mesmo corpo.<\/p><h4>Perguntas frequentes<\/h4><p>Trabalho no computador. Esse é o meu caso?<\/p><p>Provavelmente sim. Dor entre as escápulas no fim do dia é a queixa clássica deste checkpoint.<\/p><h5>Preciso de elástico?<\/h5><p>Ajuda, mas o protocolo começa com peso do corpo e toalha.<\/p><h5>Sinto dor no ombro ao levantar o braço. Paro?<\/h5><p>Teste com amplitude menor. Dor acima de 3 de 10 ou dor em pontada é sinal de recuar.<\/p><h4>Antes de fechar esta página<\/h4><p>Este texto acompanha o vídeo do módulo. Se alguma coisa aqui não bater com o que você viu na tela, vale o vídeo, porque ele mostra o movimento. E se a dúvida continuar, me manda uma mensagem: dúvida não resolvida é o principal motivo de alguém abandonar um protocolo na segunda semana.<\/p><p>Lembre da regra que vale em todos os módulos: dor até 3 de 10 durante o exercício, e no dia seguinte (24 horas) a dor tem que estar no nível de antes. Passou disso, você recua uma semana e mantém. Se acontecer duas semanas seguidas, fale comigo antes de insistir.<\/p><p>Este material é educativo e de autoavaliação funcional. Ele não substitui consulta, diagnóstico nem prescrição individualizada. Em caso de dor aguda, formigamento, perda de força ou qualquer sinal da triagem, procure atendimento presencial.<\/p>"}, {"t": "Checkpoint 9: alta demanda", "by": "Checkpoint 9 de 12, com Douglas Toral de Souza, fisioterapeuta (CREFITO-3 111.851-F).", "h": "<p>O teste de quem quer voltar a correr, jogar bola, pular. O mais exigente dos doze, e o único com liberação prévia obrigatória.<\/p><p>Este módulo não abre só com o quiz. Ele exige liberação prévia.<\/p><p>Salto em casa, sem supervisão, é o ponto de maior risco de lesão de todo o método. A triagem de sete perguntas cobre sinais de alerta de coluna, e não cobre risco de tornozelo e joelho na aterrissagem.<\/p><p>Só faça este módulo se as três condições estiverem verdadeiras:<\/p><ol><li>Você passou no teste do checkpoint 7 (unipodal) e no do checkpoint 8 (membro superior), sem dor acima de 3 de 10.<\/li><li>Você tem um espaço livre, piso firme e não escorregadio, e uma caixa estável que não tomba.<\/li><li>Você consegue aterrissar de um degrau baixo, com os dois pés, sem barulho e sem perder o equilíbrio.<\/li><\/ol><p>Se qualquer uma for falsa, não faça o checkpoint 9 agora. Fique nos checkpoints 6 e 7 e volte em quatro semanas. Isso é progressão responsável, e é a diferença entre progredir e se machucar em casa.<\/p><p>E uma restrição que não está no quiz e é minha obrigação dizer: o single leg box jump (F53) é o exercício de maior risco de todo o programa. Salto em uma perna, para uma caixa, em ambiente doméstico, sem supervisão. Se você mora em apartamento, tem piso escorregadio, ou tem qualquer dúvida sobre a sua aterrissagem, não faça este exercício. Ele é opcional dentro do módulo, e o restante do checkpoint entre
